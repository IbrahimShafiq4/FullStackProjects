<div class="min-h-screen bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <nav
        class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4 flex flex-wrap items-center justify-between transition-colors duration-300">
        <h1 class="text-xl font-bold text-gray-900 dark:text-white">🏠 PropVista</h1>

        <div class="flex items-center gap-6 text-sm">
            <a routerLink="/" class="text-gray-600 dark:text-gray-300 hover:text-gold transition">الرئيسية</a>
            <a routerLink="/properties" class="text-gray-600 dark:text-gray-300 hover:text-gold transition">جميع
                العقارات</a>
            @if (_AuthService.currentUser()?.role === 'Owner') {
            <a routerLink="/add-property" class="text-gold font-medium hover:underline">➕ إضافة عقار</a>
            }
        </div>

        <div class="flex items-center gap-4">
            @if (_AuthService.currentUser()) {
            <span class="text-gray-600 dark:text-gray-300 text-sm">{{ _AuthService.currentUser()?.fullName }}</span>
            <button (click)="_AuthService.logout()" class="text-rose-500 text-sm hover:underline">خروج</button>
            } @else {
            <a routerLink="/login" class="text-gray-600 dark:text-gray-300 hover:text-gold text-sm">دخول</a>
            <a routerLink="/register"
                class="bg-gold text-white px-4 py-2 rounded-lg text-sm hover:opacity-90 transition">إنشاء حساب</a>
            }
            <app-theme-toggle />
        </div>
    </nav>
    <router-outlet />
    <app-toast-container />
</div>
