<div appRevealOnScroll
    class="bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow border border-gray-200 dark:border-gray-700">

    <div class="relative h-52 bg-gray-100 dark:bg-gray-900">
        @if (getCurrentImageUrl(); as imgUrl) {
        <img [src]="imgUrl" class="w-full h-full object-cover">
        @if (property().images.length > 1) {
        <button (click)="prevImage()"
            class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full">‹</button>
        <button (click)="nextImage()"
            class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/50 text-white w-8 h-8 rounded-full">›</button>
        }
        }
    </div>

    <div class="p-5 space-y-3">
        <div class="flex justify-between items-start">
            <h3 class="font-semibold text-gray-900 dark:text-white">{{ property().title }}</h3>
            <span class="text-gold font-bold text-sm">{{ property().price }} ج.م</span>
        </div>
        <p class="text-sm text-gray-500 dark:text-gray-400">{{ property().description }}</p>

        @if (getFullVideo()) {
        <video [src]="getFullVideo() ? '' : ''" controls class="w-full rounded-lg"
            [attr.src]="getFullVideo()"></video>
        }

        <div class="flex gap-2">
            <input type="datetime-local" [value]="scheduledDate()"
                (input)="scheduledDate.set($any($event.target).value)" class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700
                    rounded-lg px-3 py-2 text-sm text-gray-800 dark:text-gray-200">
            <button (click)="onSchedule()"
                class="bg-gold text-white px-4 py-2 rounded-lg text-sm hover:opacity-90 transition">
                احجز معاينة
            </button>
        </div>

        @if (viewingId()) {
        <button (click)="goToVideoCall()"
            class="w-full bg-blue-600 text-white py-2 rounded-lg text-sm hover:bg-blue-700 transition mt-2">
            🎥 بدء المعاينة بالفيديو
        </button>
        }
    </div>
</div>
