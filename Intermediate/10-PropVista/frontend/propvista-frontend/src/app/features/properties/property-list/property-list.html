<div class="min-h-screen bg-gray-50 dark:bg-gray-900 px-6 py-10 transition-colors duration-300">
    <div class="max-w-5xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">PropVista 🏠</h1>
        <div class="grid sm:grid-cols-2 gap-5">
            @for (property of _PropertiesService.properties(); track property.id) {
            <app-property-card [property]="property" />
            } @empty {
            <p class="text-gray-400 text-center py-10 col-span-full">لا توجد عقارات معروضة</p>
            }
        </div>
    </div>
</div>
