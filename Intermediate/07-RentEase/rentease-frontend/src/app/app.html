<div class="min-h-screen bg-paper text-ink flex flex-col">

  <!-- COMMAND STRIP -->
  <header class="border-b border-line bg-paper sticky top-0 z-40">
    <div class="max-w-[1440px] mx-auto px-4 lg:px-8 h-14 flex items-center gap-6">

      <a routerLink="/" class="flex items-center gap-2 shrink-0">
        <span class="w-2 h-2 bg-accent"></span>
        <span class="font-extrabold tracking-tight text-[15px]">RENTEASE</span>
      </a>

      <nav class="hidden md:flex items-center gap-1 ml-2" aria-label="Primary">
        <a routerLink="/equipment" routerLinkActive="text-ink" [routerLinkActiveOptions]="{ exact: true }"
          class="px-3 py-2 font-mono text-[11px] uppercase tracking-[0.14em] text-ink-muted hover:text-ink transition-colors">
          Browse
        </a>
        @if (auth.currentUser()) {
        <a routerLink="/my-rentals" routerLinkActive="text-ink"
          class="px-3 py-2 font-mono text-[11px] uppercase tracking-[0.14em] text-ink-muted hover:text-ink transition-colors">
          My rentals
        </a>
        <a routerLink="/my-equipment" routerLinkActive="text-ink"
          class="px-3 py-2 font-mono text-[11px] uppercase tracking-[0.14em] text-ink-muted hover:text-ink transition-colors">
          My equipment
        </a>
        <a routerLink="/requests" routerLinkActive="text-ink"
          class="px-3 py-2 font-mono text-[11px] uppercase tracking-[0.14em] text-ink-muted hover:text-ink transition-colors">
          Requests
        </a>
        }
      </nav>

      <div class="flex-1"></div>

      @if (auth.currentUser(); as user) {
      <a routerLink="/profile" class="hidden sm:flex items-center gap-3 hover:opacity-80 transition-opacity">
        <span class="font-mono text-[10px] uppercase tracking-[0.14em] text-ink-muted">Owner</span>
        <span class="text-sm font-medium">{{ user.fullName }}</span>
      </a>
      <div class="w-px h-5 bg-line hidden sm:block"></div>
      <button (click)="auth.logout()" class="btn btn-ghost !h-9 !px-3" aria-label="Sign out">
        Sign out
      </button>
      } @else {
      <a routerLink="/login" class="btn btn-ghost !h-9 !px-3">Sign in</a>
      <a routerLink="/register" class="btn btn-accent !h-9 !px-3">Register</a>
      }
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <app-toast-container />
  <app-dynamic-popup />
</div>
