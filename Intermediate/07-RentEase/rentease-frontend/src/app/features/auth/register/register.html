<section class="min-h-[calc(100vh-3.5rem)] grid lg:grid-cols-2">

    <aside class="hidden lg:flex flex-col justify-between border-r border-line bg-paper-raised p-10">
        <div class="flex items-center gap-3 font-mono text-[10px] uppercase tracking-[0.2em] text-ink-muted">
            <span class="w-8 h-px bg-ink-muted"></span>
            <span>New account</span>
        </div>

        <div>
            <div class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-muted mb-4">Register / 001</div>
            <p class="text-3xl xl:text-4xl font-extrabold tracking-tight leading-[1.05]">
                Create an account.<br>
                Rent. Or list<br>your own gear.
            </p>

            <div class="mt-10 w-56 h-40 text-ink-muted">
                <app-equipment-illustration name="drill" />
            </div>
        </div>

        <div class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-faint">RentEase © 2026</div>
    </aside>

    <div class="flex items-center justify-center p-6 lg:p-10">
        <form (ngSubmit)="onSubmit()" class="w-full max-w-sm">

            <div class="flex items-center gap-3 font-mono text-[10px] uppercase tracking-[0.2em] text-ink-muted mb-6">
                <span class="w-8 h-px bg-ink-muted"></span>
                <span>Register</span>
            </div>

            <h1 class="text-3xl font-extrabold tracking-tight mb-8">Create your account.</h1>

            <div class="space-y-4">
                <label class="block">
                    <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-muted">Full name</span>
                    <input [formField]="registerForm.fullName" type="text" autocomplete="name" class="field mt-2"
                        placeholder="Ibrahim Shafiq">
                </label>
                <label class="block">
                    <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-muted">Email</span>
                    <input [formField]="registerForm.email" type="email" autocomplete="email"
                        class="field field-mono mt-2" placeholder="you@example.com">
                </label>
                <label class="block">
                    <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-muted">Password</span>
                    <input [formField]="registerForm.password" type="password" autocomplete="new-password"
                        class="field field-mono mt-2" placeholder="At least 6 characters">
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-full mt-8">Create account <span
                    aria-hidden="true">→</span></button>

            <div class="rule my-8"></div>

            <p class="font-mono text-[11px] uppercase tracking-[0.14em] text-ink-muted text-center">
                Already registered?
                <a routerLink="/login" class="text-accent hover:underline ml-1">Sign in</a>
            </p>
        </form>
    </div>
</section>
