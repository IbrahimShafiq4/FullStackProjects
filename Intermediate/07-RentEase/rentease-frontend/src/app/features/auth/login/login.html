<section class="min-h-[calc(100vh-3.5rem)] grid lg:grid-cols-2">

    <aside class="hidden lg:flex flex-col justify-between border-r border-line bg-paper-raised p-10">
        <div class="flex items-center gap-3 font-mono text-[10px] uppercase tracking-[0.2em] text-ink-muted">
            <span class="w-8 h-px bg-ink-muted"></span>
            <span>Access terminal</span>
        </div>

        <div>
            <div class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-muted mb-4">Session / 001</div>
            <p class="text-3xl xl:text-4xl font-extrabold tracking-tight leading-[1.05]">
                Sign in to enter<br>the equipment<br>exchange.
            </p>

            <div class="mt-10 w-56 h-40 text-ink-muted">
                <app-equipment-illustration name="camera" />
            </div>
        </div>

        <div class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-faint">
            RentEase © 2026
        </div>
    </aside>

    <div class="flex items-center justify-center p-6 lg:p-10">
        <form (ngSubmit)="onSubmit()" class="w-full max-w-sm">

            <div class="flex items-center gap-3 font-mono text-[10px] uppercase tracking-[0.2em] text-ink-muted mb-6">
                <span class="w-8 h-px bg-ink-muted"></span>
                <span>Sign in</span>
            </div>

            <h1 class="text-3xl font-extrabold tracking-tight mb-8">Welcome back.</h1>

            <div class="space-y-4">
                <label class="block">
                    <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-muted">Email</span>
                    <input [formField]="loginForm.email" type="email" autocomplete="email" class="field field-mono mt-2"
                        placeholder="you@example.com">
                </label>

                <label class="block">
                    <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink-muted">Password</span>
                    <input [formField]="loginForm.password" type="password" autocomplete="current-password"
                        class="field field-mono mt-2" placeholder="••••••••">
                </label>
            </div>

            <button type="submit" class="btn btn-primary w-full mt-8">Sign in <span aria-hidden="true">→</span></button>

            <div class="rule my-8"></div>

            <p class="font-mono text-[11px] uppercase tracking-[0.14em] text-ink-muted text-center">
                No account?
                <a routerLink="/register" class="text-accent hover:underline ml-1">Register</a>
            </p>
        </form>
    </div>
</section>
