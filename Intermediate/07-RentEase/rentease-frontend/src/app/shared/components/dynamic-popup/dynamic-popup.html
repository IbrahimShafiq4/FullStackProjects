@if (_PopupService.config(); as config) {
<div class="fixed inset-0 z-50 flex items-center justify-center p-4"
    style="background: rgba(20, 17, 12, 0.72); backdrop-filter: blur(4px);" role="dialog" aria-modal="true"
    [attr.aria-label]="config.title">

    <div #panel class="w-full max-w-md border border-line-strong bg-paper-raised">
        <header class="flex items-center gap-3 px-5 py-4 border-b border-line">
            <span class="status-dot" [class.status-unavailable]="config.type === 'danger'"
                [class.status-available]="config.type !== 'danger'"></span>
            <span class="font-mono text-[10px] uppercase tracking-[0.18em] text-ink-muted">{{ config.title }}</span>
        </header>

        <div class="px-5 py-6">
            <p class="text-base leading-relaxed">{{ config.message }}</p>
        </div>

        <footer class="flex border-t border-line">
            <button (click)="onCancel()"
                class="flex-1 py-4 font-mono text-[11px] uppercase tracking-[0.16em] text-ink-muted hover:text-ink hover:bg-paper border-r border-line transition-colors">
                {{ config.cancelLabel ?? 'Cancel' }}
            </button>
            <button (click)="onConfirm()"
                class="flex-1 py-4 font-mono text-[11px] uppercase tracking-[0.16em] transition-colors"
                [style.background]="config.type === 'danger' ? 'var(--color-signal-unavailable)' : 'var(--color-accent)'"
                style="color: white;">
                {{ config.confirmLabel ?? 'Confirm' }}
            </button>
        </footer>
    </div>
</div>
}
