<div class="wrap">
    <div class="card">

        @if (loading()) {
        <div class="skeleton head-skeleton"></div>
        <div class="skeleton line-skeleton"></div>
        } @else if (user(); as u) {

        <div class="profile-head">
            <div class="avatar">
                @if (u.avatarUrl) {
                <img [src]="'https://localhost:7071' + u.avatarUrl" alt="">
                } @else {
                <span>{{ u.fullName.charAt(0) }}</span>
                }
            </div>

            <div class="profile-info">
                <p class="eyebrow"><span class="dot"></span> ملف شخصي</p>
                <h1 class="profile-name">{{ u.fullName }}</h1>
                <p class="profile-email">{{ u.email }}</p>
            </div>
        </div>

        <div class="upload">
            <label class="file">
                <input type="file" (change)="onFile($event)" accept="image/*">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                <span>اختر صورة</span>
            </label>

            <button (click)="upload()" class="primary" [disabled]="!selected || uploading()">
                {{ uploading() ? 'جارٍ الرفع…' : 'تحديث الصورة' }}
            </button>
        </div>

        }
    </div>
</div>
