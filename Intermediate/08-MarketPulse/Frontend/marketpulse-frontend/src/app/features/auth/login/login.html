<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
    <form (ngSubmit)="onSubmit()"
        class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg border border-gray-200 dark:border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white"> تسجيل الدخول </h1>
        <input [formField]="loginForm.email" type="email" placeholder="البريد الإلكترونى" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 
            rounded-lg px-4 py-3 mb-3 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 
            focus:ring-amber transition ease-linear duration-300" />
        <input [formField]="loginForm.password" type="password" placeholder="البريد الإلكترونى" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 
            rounded-lg px-4 py-3 mb-3 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 
            focus:ring-amber transition ease-linear duration-300" />
        <button type="submit"
            class="w-full bg-amber text-white py-3 rounded-lg font-medium hover:opacity-90 transition">تسجيل</button>
        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-5"> معندكس حساب ؟ <a routerLink="/register"
                class="text-amber hover:underline font-medium"> سجل حساب جديد </a> </p>
    </form>
</div>
