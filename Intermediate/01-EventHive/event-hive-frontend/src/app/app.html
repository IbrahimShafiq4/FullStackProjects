<div class="min-h-screen bg-gray-50 dark:bg-gray-900">
    <!-- Navbar -->
    <nav
        class="bg-white dark:bg-gray-800 shadow-sm border-b border-gray-200 dark:border-gray-700 px-6 py-3 flex justify-between items-center">
        <a routerLink="/events" class="text-xl font-bold text-gray-800 dark:text-white">📅 EventHive</a>

        <div class="flex items-center gap-4">
            @if (auth.currentUser()) {
            <span class="text-gray-700 dark:text-gray-300">{{ auth.currentUser()?.fullName }}</span>
            <button (click)="auth.logout()" class="text-red-600 hover:underline">خروج</button>
            }
        </div>
    </nav>

    <router-outlet />

    <!-- Toast Container -->
    <div class="fixed top-5 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2">
        @for (toast of toast.toasts(); track toast.id) {
        <div class="px-5 py-3 rounded-lg shadow-lg text-white text-sm min-w-64 text-center animate-toast-in
                    {{ toast.type === 'success' ? 'bg-green-600' : '' }}
                    {{ toast.type === 'error' ? 'bg-red-600' : '' }}
                    {{ toast.type === 'info' ? 'bg-blue-600' : '' }}">
            {{ toast.message }}
        </div>
        }
    </div>
</div>
