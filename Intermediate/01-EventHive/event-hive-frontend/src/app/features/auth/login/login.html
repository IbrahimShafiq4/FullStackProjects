<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4">
    <form (ngSubmit)="onSubmit()" class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold text-center text-gray-800 dark:text-white mb-6">🔐 تسجيل الدخول</h1>

        <input [(ngModel)]="model.email" type="email" name="email" placeholder="كلمة المرور"
            class="w-full px-4 py-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />

        <input [(ngModel)]="model.password" type="password" name="password" placeholder="كلمة المرور"
            class="w-full px-4 py-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white" />

        <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg transition duration-300 ease-linear">
            دخول
        </button>

        <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-4">
            معندكش حساب ؟
            <a routerLink="/register" class="text-blue-600 hover:underline transition duration-300 ease-linear">سجل
                الآن</a>
        </p>
    </form>
</div>
