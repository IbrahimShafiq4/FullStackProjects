<div class="min-h-screen bg-gray-50 dark:bg-gray-900 px-6 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 dark:text-white">📅 الفعاليات</h1>
            <div class="flex gap-3">
                <button (click)="toggleUpcoming()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">
                    {{ showUpcoming() ? 'كل الفعاليات' : 'القادمة فقط' }}
                </button>

                @if (isOrganizer()) {
                <a routerLink="/events/new"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg transition">
                    + إضافة فعالية
                </a>
                }
            </div>
        </div>

        @for (event of _EventService.events(); track event.id) {
        <app-event-card [event]="event" (onRsvp)="onRsvp($event)" (onCancelRsvp)="onCancelRsvp($event)"
            (onDelete)="onDelete($event)" class="mb-4 block" />
        } @empty {
        <p class="text-center text-gray-500 dark:text-gray-400 py-10">لا توجد فعاليات</p>
        }
    </div>
</div>
