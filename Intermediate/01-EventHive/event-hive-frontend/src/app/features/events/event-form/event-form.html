<div class="form-page">
    <div class="form-bg"></div>

    <div class="form-inner">
        <a routerLink="/events" class="form-back">
            <span>←</span>
            <span>العودة إلى الفعاليات</span>
        </a>

        <header class="form-head">
            <span class="form-kicker">{{ isEditMode() ? 'تعديل' : 'إنشاء' }}</span>
            <h1 class="form-title">
                {{ isEditMode() ? 'عدّل' : 'أنشئ' }}
                <em>فعاليتك</em>
            </h1>
            <p class="form-sub">
                {{ isEditMode() ? 'حدّث بيانات الفعالية واحفظ التغييرات' : 'املأ البيانات التالية لإطلاق فعاليتك' }}
            </p>
        </header>

        <form (ngSubmit)="onSubmit()" class="form-body">
            <section class="form-section">
                <div class="form-section-head">
                    <span class="form-section-num">01</span>
                    <h2 class="form-section-title">المعلومات الأساسية</h2>
                </div>

                <div class="form-grid">
                    <div class="form-field form-field-full">
                        <label>عنوان الفعالية</label>
                        <input [(ngModel)]="model.title" name="title" type="text"
                            placeholder="مثال: مؤتمر التقنية السنوي" required />
                    </div>

                    <div class="form-field form-field-full">
                        <label>الوصف</label>
                        <textarea [(ngModel)]="model.description" name="description" rows="4"
                            placeholder="اكتب وصفاً جاذباً لفعاليتك..."></textarea>
                    </div>

                    <div class="form-field">
                        <label>الموقع</label>
                        <input [(ngModel)]="model.location" name="location" type="text"
                            placeholder="مثال: القاهرة، مصر" />
                    </div>

                    <div class="form-field">
                        <label>السعة الإجمالية</label>
                        <input [(ngModel)]="model.capacity" name="capacity" type="number" min="1" required />
                    </div>
                </div>
            </section>

            <section class="form-section">
                <div class="form-section-head">
                    <span class="form-section-num">02</span>
                    <h2 class="form-section-title">التوقيت</h2>
                </div>

                <div class="form-grid">
                    <div class="form-field">
                        <label>تاريخ البدء</label>
                        <input [(ngModel)]="model.startDate" name="startDate" type="datetime-local" required />
                    </div>

                    <div class="form-field">
                        <label>تاريخ الانتهاء</label>
                        <input [(ngModel)]="model.endDate" name="endDate" type="datetime-local" required />
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="form-btn form-btn-primary">
                    {{ isEditMode() ? 'حفظ التغييرات' : 'إنشاء الفعالية' }}
                    <span>←</span>
                </button>
                <a routerLink="/events" class="form-btn form-btn-ghost">
                    إلغاء
                </a>
            </div>
        </form>
    </div>
</div>
