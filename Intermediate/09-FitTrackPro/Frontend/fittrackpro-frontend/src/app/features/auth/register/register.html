<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4">
    <form (ngSubmit)="onSubmit()"
        class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-96 border border-gray-200 dark:border-gray-700">
        <h1 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">إنشاء حساب</h1>
        <input [formField]="registerForm.fullName" type="text" placeholder="الاسم بالكامل"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-3 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-pulse transition">
        <input [formField]="registerForm.email" type="email" placeholder="البريد الإلكتروني"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-3 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-pulse transition">
        <input [formField]="registerForm.password" type="password" placeholder="كلمة المرور"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-3 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-pulse transition">
        <select [formField]="registerForm.role"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-4 text-gray-800 dark:text-gray-200">
            <option [value]="2">متدرب</option>
            <option [value]="1">مدرب</option>
        </select>
        <button type="submit"
            class="w-full bg-pulse text-white py-3 rounded-lg font-medium hover:opacity-90 transition">تسجيل</button>
        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-5">عندك حساب بالفعل؟ <a routerLink="/login"
                class="text-pulse hover:underline font-medium">سجل دخولك</a></p>
    </form>
</div>
