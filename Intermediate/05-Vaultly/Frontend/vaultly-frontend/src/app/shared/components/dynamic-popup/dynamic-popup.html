@if(_PopupService.config(); as config) {
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
    <div #panel class="text-white dark:bg-slate-950 rounded-2xl p-6 w-96 shadow-2xl border border-amber-200/5">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white"> {{ config.title }} </h2>
        <p class="text-gray-600 dark:text-gray-300 text-sm mt-2"> {{ config.message }} </p>

        <div class="flex gap-3 mt-6">
            <button (click)="onCancel()"
                class="flex-1 py-2.5 dark:text-gray-300 text-sm font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-all duration-300 ease-in-out">
                {{ config.cancelLabels ?? 'إلغاء' }}
            </button>
            <button (click)="onConfirm()" class="flex-1 py-2.5 rounded-lg text-sm font-medium transition text-white"
                [class.bg-rose-500]="config.type === 'danger'" [class.bg-amber-50]="config.type !== 'danger'">
                {{ config.confirmLabels ?? 'تأكيد' }}
            </button>
        </div>
    </div>
</div>
}
