@if(_PopupService.config(); as config) {
<div class="fixed inset-0 bg-basalt-900/70 backdrop-blur-sm flex items-center justify-center z-[70] px-4"
    (click)="onCancel()">
    <div #panel (click)="$event.stopPropagation()" class="w-full max-w-md rounded-xl p-6
                bg-papyrus-50 dark:bg-basalt-800
                border border-bronze-500/30
                shadow-[0_20px_60px_-20px_rgba(0,0,0,0.5)]">

        <div class="text-xs tracking-[0.3em] uppercase text-bronze-600 dark:text-bronze-300 mb-2">
            {{ config.type === 'danger' ? 'Caution' : 'Confirm' }}
        </div>
        <h2 class="font-display text-2xl text-basalt-800 dark:text-papyrus-100 mb-2">
            {{ config.title }}
        </h2>
        <p class="text-sm text-basalt-500 dark:text-papyrus-200/75 leading-relaxed">
            {{ config.message }}
        </p>

        <div class="carved-divider my-5"></div>

        <div class="flex gap-3">
            <button (click)="onCancel()" class="flex-1 py-2.5 rounded-md text-sm font-medium
                       border border-bronze-500/25
                       text-basalt-500 dark:text-papyrus-200
                       hover:bg-bronze-500/10 transition-colors">
                {{ config.cancelLabels ?? 'إلغاء' }}
            </button>
            <button (click)="onConfirm()" class="flex-1 py-2.5 rounded-md text-sm font-semibold transition-colors"
                [class.bg-terracotta-500]="config.type === 'danger'" [class.text-white]="config.type === 'danger'"
                [class.hover:bg-terracotta-600]="config.type === 'danger'"
                [class.bg-bronze-500]="config.type !== 'danger'" [class.text-basalt-900]="config.type !== 'danger'"
                [class.hover:bg-bronze-400]="config.type !== 'danger'">
                {{ config.confirmLabels ?? 'تأكيد' }}
            </button>
        </div>
    </div>
</div>
}
