<div class="min-h-[calc(100vh-140px)] flex items-center justify-center px-4 py-14">
    <div class="w-full max-w-md animate-fade-up">

        <div class="text-center mb-8">
            <div class="text-xs tracking-[0.35em] uppercase text-bronze-600 dark:text-bronze-300 mb-3">
                Entry · الدخول
            </div>
            <h1 class="font-display text-4xl text-basalt-800 dark:text-papyrus-100">
                سجّل دخولك
            </h1>
            <p class="text-sm text-basalt-400 dark:text-papyrus-200/60 mt-2">
                كمّل من حيث ما وقفت في الأرشيف
            </p>
        </div>

        <form (ngSubmit)="onSubmit()" class="rounded-xl border border-bronze-500/25
                 bg-papyrus-50/60 dark:bg-basalt-800/60
                 backdrop-blur-sm p-7 shadow-[0_1px_0_0_rgba(166,130,31,0.06)]">

            <label class="block text-xs tracking-widest text-bronze-600 dark:text-bronze-300 mb-2">
                البريد الإلكتروني
            </label>
            <input [formField]="loginForm.email" type="email" placeholder="you@example.com" dir="ltr" class="w-full bg-white/80 dark:bg-basalt-900/70
                    border border-bronze-500/25 rounded-md
                    px-4 py-3 mb-4 text-basalt-800 dark:text-papyrus-100
                    placeholder:text-basalt-300 dark:placeholder:text-papyrus-300/40
                    focus:outline-none focus:border-bronze-500
                    focus:ring-2 focus:ring-bronze-500/20 transition">

            <label class="block text-xs tracking-widest text-bronze-600 dark:text-bronze-300 mb-2">
                كلمة المرور
            </label>
            <input [formField]="loginForm.password" type="password" placeholder="••••••••" dir="ltr" class="w-full bg-white/80 dark:bg-basalt-900/70
                    border border-bronze-500/25 rounded-md
                    px-4 py-3 mb-6 text-basalt-800 dark:text-papyrus-100
                    placeholder:text-basalt-300 dark:placeholder:text-papyrus-300/40
                    focus:outline-none focus:border-bronze-500
                    focus:ring-2 focus:ring-bronze-500/20 transition">

            <button type="submit" class="w-full py-3 rounded-md font-semibold
                     bg-bronze-500 text-basalt-900
                     hover:bg-bronze-400 active:translate-y-px
                     transition-all duration-200">
                دخول
            </button>

            <p class="text-center text-sm text-basalt-400 dark:text-papyrus-200/60 mt-5">
                لسه ماعندكش حساب؟
                <a routerLink="/register" class="text-bronze-600 dark:text-bronze-300 hover:underline font-medium">
                    أنشئ واحد
                </a>
            </p>
        </form>
    </div>
</div>
