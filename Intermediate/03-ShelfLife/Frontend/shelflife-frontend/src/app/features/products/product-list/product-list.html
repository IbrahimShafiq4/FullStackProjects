<div class="pl-page">
    <div class="pl-inner">
        <div class="pl-head">
            <div class="pl-title-block">
                <div class="pl-title-icon">▦</div>
                <div>
                    <h1 class="pl-title">مخزون المطبخ</h1>
                    <p class="pl-sub">كل المنتجات في مكان واحد</p>
                </div>
            </div>

            <div class="pl-count">
                <span class="pl-count-num">{{ _products.products().length }}</span>
                <span>ITEMS</span>
            </div>
        </div>

        <app-product-form (productAdded)="_products.loadProducts()" />

        <div class="pl-grid">
            @for (product of _products.products(); track product.id) {
            <app-product-card
                [product]="product"
                [photoUrl]="product.photoUrl ? _products.getFullUrl(product.photoUrl) : null"
                [voiceUrl]="product.voiceNoteUrl ? _products.getFullUrl(product.voiceNoteUrl) : null"
                (onDelete)="onDelete($event)" />
            } @empty {
            <div class="pl-empty">
                <div class="pl-empty-icon">📦</div>
                <h3 class="pl-empty-title">المخزون فاضي</h3>
                <p class="pl-empty-sub">ابدأ بإضافة أول منتج من الفورم فوق</p>
            </div>
            }
        </div>
    </div>
</div>
