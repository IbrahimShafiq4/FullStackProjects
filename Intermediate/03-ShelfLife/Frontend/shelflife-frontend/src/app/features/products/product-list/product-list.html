<div class="min-h-screen bg-gray-50 dark:bg-gray-900 px-6 py-10 transition-colors duration-300">
    <div class="max-w-4xl mx-auto space-y-6">

        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">مخزون المطبخ</h1>

        <app-product-form (productAdded)="_ProductsService.loadProducts()" />

        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 mt-3">
            @for (product of _ProductsService.products(); track product.id) {
            <app-product-card [product]="product"
                [photoUrl]="product.photoUrl ? _ProductsService.getFullUrl(product.photoUrl) : null"
                [voiceUrl]="product.voiceNoteUrl ? _ProductsService.getFullUrl(product.voiceNoteUrl) : null"
                (onDelete)="onDelete($event)" />
            } @empty {
            <p class="text-gray-400 text-center py-10 col-span-full">لا توجد منتجات مسجلة</p>
            }
        </div>
    </div>
</div>
