<form class="form-card" (ngSubmit)="onSubmit()">
    <div class="form-head">
        <div class="form-head-icon">+</div>
        <h2 class="form-head-title">منتج جديد</h2>
    </div>

    <div class="form-grid-full">
        <div class="form-field">
            <label class="form-label">اسم المنتج</label>
            <input class="form-input" [(ngModel)]="model.name" name="name" type="text"
                placeholder="مثال: طماطم، لبن، بيض" required />
        </div>
    </div>

    <div class="form-grid">
        <div class="form-field">
            <label class="form-label">الكمية</label>
            <input class="form-input" [(ngModel)]="model.quantity" name="quantity" type="number" min="1" required />
        </div>

        <div class="form-field">
            <label class="form-label">تاريخ الانتهاء</label>
            <input class="form-input" [(ngModel)]="model.expiryDate" name="expiryDate" type="date" required />
        </div>
    </div>

    <div class="file-row">
        <label class="file-label" for="photo-input">📷 اختر صورة</label>
        <input id="photo-input" class="file-input" type="file" accept=".jpg,.jpeg,.png"
            (change)="onPhotoSelected($event)" />
        <span class="file-name">
            {{ selectedPhoto() ? selectedPhoto()!.name : 'مفيش صورة' }}
        </span>
    </div>

    <app-voice-recorder (recordingReady)="onVoiceRecorded($event)" />

    <button type="submit" class="form-submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'جاري الإضافة...' : 'إضافة المنتج ←' }}
    </button>
</form>
