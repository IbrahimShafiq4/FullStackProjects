<div class="p-card">
    <div class="p-card-photo">
        @if (photoUrl()) {
        <img [src]="photoUrl()!" [alt]="product().name">
        } @else {
        <span>{{ product().name.charAt(0) }}</span>
        }

        <span class="p-card-badge" [class]="badgeTone()">
            {{ badgeLabel() }}
        </span>
    </div>

    <div class="p-card-body">
        <h3 class="p-card-name">{{ product().name }}</h3>

        <p class="p-card-info">
            <strong>الكمية:</strong> {{ product().quantity }}<br>
            <strong>ينتهي:</strong> {{ product().expiryDate | date: 'dd/MM/yyyy' }}
        </p>

        @if (voiceUrl()) {
        <audio class="p-card-audio" [src]="voiceUrl()!" controls></audio>
        }

        <div class="p-card-foot">
            <span class="p-card-id">#{{ product().id.toString().padStart(4, '0') }}</span>

            <div class="p-card-actions">
                <a [routerLink]="['/products', product().id]" class="p-card-btn p-card-btn-view">
                    <span>اعرض</span>
                    <span>←</span>
                </a>

                <button type="button" class="p-card-btn p-card-btn-delete" (click)="onDeleteClick($event)">
                    <span>✕</span>
                </button>
            </div>
        </div>
    </div>
</div>
