<div class="auth-stage">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-mark">SL</div>
            <div class="auth-brand-texts">
                <span class="auth-brand-name">ShelfLife</span>
                <span class="auth-brand-tag">KITCHEN JOURNAL</span>
            </div>
        </div>

        <h1 class="auth-title">تسجيل الدخول</h1>
        <p class="auth-sub">ادخل بياناتك وابدأ من جديد</p>

        <form (ngSubmit)="onSubmit()">
            <div class="field">
                <label class="field-label">البريد الإلكتروني</label>
                <input class="field-input" [(ngModel)]="model.email" name="email" type="email"
                    placeholder="you@example.com" required />
            </div>

            <div class="field">
                <label class="field-label">كلمة المرور</label>
                <input class="field-input" [(ngModel)]="model.password" name="password" type="password"
                    placeholder="••••••••" required />
            </div>

            <button type="submit" class="btn-submit">دخول ←</button>

            <p class="auth-foot">
                ما عندك حساب؟
                <a routerLink="/register">أنشئ حساب</a>
            </p>
        </form>
    </div>
</div>
