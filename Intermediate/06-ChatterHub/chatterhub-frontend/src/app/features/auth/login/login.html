<main class="auth">

    <button class="auth__theme icon-btn" (click)="theme.toggle()" aria-label="Toggle theme">
        <app-icon [name]="theme.theme() === 'light' ? 'moon' : 'sun'" [size]="18" />
    </button>

    <div class="auth__card card--lg animate-pop">

        <div class="auth__brand">
            <div class="auth__logo">
                <app-icon name="message" [size]="24" />
            </div>
            <h1 class="h1 auth__title">Welcome back</h1>
            <p class="body auth__subtitle">Sign in to continue to ChatterHub</p>
        </div>

        <form (ngSubmit)="onSubmit()" novalidate class="auth__form">

            <label class="field">
                <span class="field__label">Email</span>
                <input class="field__input" [formField]="loginForm.email" type="email" autocomplete="email"
                    placeholder="you@example.com" spellcheck="false" />
            </label>

            <label class="field">
                <span class="field__label">Password</span>
                <input class="field__input" [formField]="loginForm.password" type="password"
                    autocomplete="current-password" placeholder="••••••••" />
            </label>

            <button type="submit" class="btn btn--primary btn--wide">
                Sign in
            </button>

            <p class="auth__alt">
                Don't have an account?
                <a routerLink="/register" class="auth__link">Create one</a>
            </p>
        </form>

    </div>
</main>
