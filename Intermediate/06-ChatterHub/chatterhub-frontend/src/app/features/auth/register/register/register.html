<main class="auth">

    <button class="auth__theme icon-btn" (click)="theme.toggle()" aria-label="Toggle theme">
        <app-icon [name]="theme.theme() === 'light' ? 'moon' : 'sun'" [size]="18" />
    </button>

    <div class="auth__card card--lg animate-pop">

        <div class="auth__brand">
            <div class="auth__logo">
                <app-icon name="users" [size]="24" />
            </div>
            <h1 class="h1 auth__title">Create account</h1>
            <p class="body auth__subtitle">Join ChatterHub and start chatting</p>
        </div>

        <form (ngSubmit)="onSubmit()" novalidate class="auth__form">

            <label class="field">
                <span class="field__label">Full name</span>
                <input class="field__input" [formField]="registerForm.fullName" type="text" autocomplete="name"
                    placeholder="Your name" spellcheck="false" />
            </label>

            <label class="field">
                <span class="field__label">Email</span>
                <input class="field__input" [formField]="registerForm.email" type="email" autocomplete="email"
                    placeholder="you@example.com" spellcheck="false" />
            </label>

            <label class="field">
                <span class="field__label">Password</span>
                <input class="field__input" [formField]="registerForm.password" type="password"
                    autocomplete="new-password" placeholder="At least 6 characters" />
            </label>

            <button type="submit" class="btn btn--primary btn--wide">
                Create account
            </button>

            <p class="auth__alt">
                Already have an account?
                <a routerLink="/login" class="auth__link">Sign in</a>
            </p>
        </form>

    </div>
</main>
