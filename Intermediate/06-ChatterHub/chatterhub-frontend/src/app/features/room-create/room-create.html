<main class="create">

    <header class="create__top">
        <a routerLink="/home" class="icon-btn" aria-label="Back">
            <app-icon name="arrow-left" [size]="18" />
        </a>
        <h1 class="create__title">New Room</h1>
        <button class="icon-btn" (click)="theme.toggle()" aria-label="Toggle theme">
            <app-icon [name]="theme.theme() === 'light' ? 'moon' : 'sun'" [size]="18" />
        </button>
    </header>

    <div class="create__card card--lg animate-pop">

        <div class="create__icon">
            <app-icon name="message" [size]="28" />
        </div>

        <h2 class="h1 create__heading">Create a room</h2>
        <p class="body create__sub">Give it a name and a short description.</p>

        <form (ngSubmit)="onSubmit()" novalidate class="create__form">

            <label class="field">
                <span class="field__label">Room name</span>
                <input class="field__input" [formField]="roomForm.name" type="text" autocomplete="off"
                    placeholder="e.g. General, Design, Team" spellcheck="false" />
            </label>

            <label class="field">
                <span class="field__label">Description <span style="color: var(--muted-2);">(optional)</span></span>
                <input class="field__input" [formField]="roomForm.topic" type="text" autocomplete="off"
                    placeholder="What is this room about?" spellcheck="false" />
            </label>

            <button type="submit" class="btn btn--primary btn--wide">
                Create room
            </button>

        </form>

    </div>
</main>
