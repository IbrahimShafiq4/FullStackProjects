<div class="min-h-screen flex items-center justify-center bg-chat-bg px-4">
    <form (ngSubmit)="onSubmit()" class="glass-panel rounded-2xl p-8 w-96">
        <h1 class="text-2xl font-bold text-white mb-6">غرفة جديدة</h1>
        <input [formField]="roomForm.name" type="text" placeholder="اسم الغرفة"
            class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 mb-3 text-white">
        <input [formField]="roomForm.topic" type="text" placeholder="الموضوع"
            class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 mb-4 text-white">
        <button type="submit"
            class="w-full bg-chat text-white py-3 rounded-lg font-semibold press-feedback">إنشاء</button>
    </form>
</div>
