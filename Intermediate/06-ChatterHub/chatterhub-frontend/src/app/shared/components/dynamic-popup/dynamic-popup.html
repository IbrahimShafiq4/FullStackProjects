@if (popup.config(); as config) {
<div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
    <div #panel class="glass-panel rounded-2xl p-6 w-96 shadow-2xl">
        <h2 class="text-lg font-display font-bold text-white">{{ config.title }}</h2>
        <p class="text-gray-300 text-sm mt-2">{{ config.message }}</p>
        <div class="flex gap-3 mt-6">
            <button (click)="onCancel()"
                class="flex-1 py-2.5 rounded-lg border border-white/20 text-gray-300 text-sm font-medium press-feedback">
                {{ config.cancelLabel ?? 'إلغاء' }}
            </button>
            <button (click)="onConfirm()" class="flex-1 py-2.5 rounded-lg text-sm font-medium text-white press-feedback"
                [class.bg-rose-600]="config.type === 'danger'" [class.bg-chat]="config.type !== 'danger'">
                {{ config.confirmLabel ?? 'تأكيد' }}
            </button>
        </div>
    </div>
</div>
}
