<div class="aero-desktop">

    @if (showTaskbar()) {
    <div class="aero-taskbar">
        <div class="taskbar-shine"></div>

        <div class="taskbar-inner">
            <a routerLink="/gigs" class="start-orb" aria-label="Start">
                <span class="orb-logo">GL</span>
                <span class="orb-shine"></span>
            </a>

            <div class="taskbar-divider"></div>

            <div class="taskbar-items">
                <a routerLink="/gigs" class="taskbar-item">
                    <span class="taskbar-item-icon">▦</span>
                    <span class="taskbar-item-text">المهام</span>
                </a>
            </div>

            <div class="taskbar-spacer"></div>

            <div class="taskbar-tray">
                @if (auth.currentUser(); as user) {
                <div class="tray-user">
                    <div class="tray-avatar">{{ user.fullName.charAt(0) }}</div>
                    <div class="tray-texts">
                        <span class="tray-name">{{ user.fullName }}</span>
                        <span class="tray-role">{{ user.role === 'Client' ? 'صاحب مهمة' : 'فريلانسر' }}</span>
                    </div>
                </div>

                <button class="tray-btn" (click)="auth.logout()" title="خروج">
                    <span>⏻</span>
                </button>
                }
            </div>

            <div class="show-desktop-bar" title="إظهار سطح المكتب"></div>
        </div>
    </div>
    }

    <main [class.with-taskbar]="showTaskbar()">
        <router-outlet />
    </main>

    <app-toast-container />
</div>
