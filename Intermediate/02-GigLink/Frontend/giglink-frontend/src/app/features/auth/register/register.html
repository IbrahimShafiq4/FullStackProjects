<div class="auth-desktop">
    <div class="aero-window">

        <div class="aero-titlebar">
            <div class="title-left">
                <span class="title-icon">📝</span>
                <span class="title-text">GigLink — إنشاء حساب</span>
            </div>
            <div class="window-controls">
                <button class="win-ctrl" type="button" aria-label="minimize">
                    <span class="win-ctrl-icon">−</span>
                </button>
                <button class="win-ctrl" type="button" aria-label="maximize">
                    <span class="win-ctrl-icon">▢</span>
                </button>
                <a routerLink="/" class="win-ctrl win-ctrl-close" aria-label="close">
                    <span class="win-ctrl-icon">✕</span>
                </a>
            </div>
        </div>

        <div class="aero-content">
            <div class="content-head">
                <div class="content-avatar">GL</div>
                <h1 class="content-title">انضم إلى GigLink</h1>
                <p class="content-sub">اختر نوع حسابك وابدأ رحلتك</p>
            </div>

            <form (ngSubmit)="onSubmit()">
                <div class="role-picker">
                    <button type="button" class="role-opt" [class.active]="registerModel.role === 'Client'"
                        (click)="pickRole('Client')">
                        <span class="role-icon">👤</span>
                        <span class="role-texts">
                            <span class="role-key">CLIENT</span>
                            <span class="role-name">صاحب مهمة</span>
                        </span>
                    </button>
                    <button type="button" class="role-opt" [class.active]="registerModel.role === 'Freelancer'"
                        (click)="pickRole('Freelancer')">
                        <span class="role-icon">⚡</span>
                        <span class="role-texts">
                            <span class="role-key">FREELANCER</span>
                            <span class="role-name">فريلانسر</span>
                        </span>
                    </button>
                </div>

                <div class="field-group">
                    <label class="field-label">الاسم بالكامل</label>
                    <input class="aero-input" [(ngModel)]="registerModel.fullName" name="fullName" type="text"
                        placeholder="إبراهيم شفيق" required />
                </div>

                <div class="field-group">
                    <label class="field-label">البريد الإلكتروني</label>
                    <input class="aero-input" [(ngModel)]="registerModel.email" name="email" type="email"
                        placeholder="you@example.com" required />
                </div>

                <div class="field-group">
                    <label class="field-label">كلمة المرور</label>
                    <input class="aero-input" [(ngModel)]="registerModel.password" name="password" type="password"
                        placeholder="••••••••" required />
                </div>

                <button type="submit" class="aero-submit">إنشاء الحساب</button>

                <p class="content-foot">
                    عندك حساب بالفعل؟
                    <a routerLink="/login">سجّل دخولك</a>
                </p>
            </form>
        </div>

    </div>
</div>
