<div class="auth-desktop">
    <div class="aero-window">

        <div class="aero-titlebar">
            <div class="title-left">
                <span class="title-icon">🔐</span>
                <span class="title-text">GigLink — تسجيل الدخول</span>
            </div>
            <div class="window-controls">
                <button class="win-ctrl" type="button" aria-label="minimize">
                    <span class="win-ctrl-icon">−</span>
                </button>
                <button class="win-ctrl" type="button" aria-label="maximize">
                    <span class="win-ctrl-icon">▢</span>
                </button>
                <a routerLink="/" class="win-ctrl win-ctrl-close" aria-label="close">
                    <span class="win-ctrl-icon">✕</span>
                </a>
            </div>
        </div>

        <div class="aero-content">
            <div class="content-head">
                <div class="content-avatar">GL</div>
                <h1 class="content-title">مرحباً بعودتك</h1>
                <p class="content-sub">سجّل دخولك لمتابعة مهامك</p>
            </div>

            <form (ngSubmit)="onSubmit()">
                <div class="field-group">
                    <label class="field-label">البريد الإلكتروني</label>
                    <input class="aero-input" [(ngModel)]="loginModel.email" name="email" type="email"
                        placeholder="you@example.com" required />
                </div>

                <div class="field-group">
                    <label class="field-label">كلمة المرور</label>
                    <input class="aero-input" [(ngModel)]="loginModel.password" name="password" type="password"
                        placeholder="••••••••" required />
                </div>

                <button type="submit" class="aero-submit">تسجيل الدخول</button>

                <p class="content-foot">
                    ما عندك حساب؟
                    <a routerLink="/register">أنشئ واحد الآن</a>
                </p>
            </form>
        </div>

    </div>
</div>
