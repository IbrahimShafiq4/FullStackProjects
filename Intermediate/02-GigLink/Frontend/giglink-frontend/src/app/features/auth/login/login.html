<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4">
    <form (ngSubmit)="onSubmit()"
        class="border border-gray-200 dark:border-gray-700 w-96 shadow-xl rounded-2xl p-8 bg-white dark:bg-gray-800">

        <h1 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">تسجيل الدخول</h1>
        <input [formField]="loginForm.email" type="email" placeholder="البريد الإلكترونى"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700
                rounded-lg px-4 py-3 mb-3 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-300 transition-all duration-300 ease-linear" />
        <input [formField]="loginForm.password" type="password" placeholder="البريد الإلكترونى"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700
                rounded-lg px-4 py-3 mb-3 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-300 transition-all duration-300 ease-linear" />

        <button type="submit"
            class="w-full bg-emerald-500 text-dark font-bold py-3 rounded-lg font-medim hover:opacity-90 transition-all duration-300 ease-linear">دخول</button>

        <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-5">
            معندكش حساب ؟
            <a routerLink="/register" class="text-emerald-300 hover:underline font-medium">سجل حساب جديد</a>
        </p>
    </form>
</div>
