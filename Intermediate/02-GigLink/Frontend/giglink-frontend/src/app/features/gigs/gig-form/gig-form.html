<form (ngSubmit)="onSubmit()" class="gf-panel">

    <div class="gf-head">
        <div class="gf-head-icon">+</div>
        <h2 class="gf-title">انشر مهمة جديدة</h2>
    </div>

    <div class="gf-grid gf-grid-full">
        <div class="gf-field">
            <label class="gf-label">عنوان المهمة</label>
            <input class="gf-input" [(ngModel)]="formModel.title" name="title" type="text"
                placeholder="مثال: تصميم موقع تعريفي" required />
        </div>
    </div>

    <div class="gf-grid gf-grid-full">
        <div class="gf-field">
            <label class="gf-label">وصف المهمة</label>
            <textarea class="gf-textarea" [(ngModel)]="formModel.description" name="description"
                placeholder="اشرح المهمة والمتطلبات بالتفصيل..." required></textarea>
        </div>
    </div>

    <div class="gf-grid">
        <div class="gf-field">
            <label class="gf-label">الميزانية (ج.م)</label>
            <input class="gf-input" [(ngModel)]="formModel.budget" name="budget" type="number" placeholder="1000"
                min="1" required />
        </div>
    </div>

    <button type="submit" class="gf-btn" [disabled]="isSubmitting()">
        <span>{{ isSubmitting() ? 'جارى النشر...' : 'انشر المهمة' }}</span>
        <span>←</span>
    </button>

</form>
