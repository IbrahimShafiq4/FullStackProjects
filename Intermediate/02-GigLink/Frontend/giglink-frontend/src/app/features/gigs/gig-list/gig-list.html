<div class="min-h-screen bg-gray-50 dark:bg-gray-900 px-6 py-10 transition-colors duration-300">
    <div class="max-w-3xl mx-auto space-y-6">

        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">المهام المتاحة</h1>

        @if (_AuthService.currentUser()?.role === 'Client') {
        <app-gig-form (gigCreated)="_GigsService.loadOpenGigs()" />
        }

        <div class="space-y-4">
            @for (gig of _GigsService.gigs(); track gig.id) {
            <a [routerLink]="['/gigs', gig.id]" class="block bg-white dark:bg-gray-800 rounded-xl p-5 shadow border border-gray-200
                    dark:border-gray-700 hover:border-brand transition-colors duration-300">
                <div class="flex justify-between items-start">
                    <h3 class="font-semibold text-gray-900 dark:text-white">{{ gig.title }}</h3>
                    <span class="text-brand font-bold text-sm">{{ gig.budget }} ج.م</span>
                </div>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1 line-clamp-2">{{ gig.description }}</p>
                <p class="text-xs text-gray-400 mt-2">بواسطة {{ gig.clientName }}</p>
            </a>
            } @empty {
            <p class="text-gray-400 text-center py-10">لا توجد مهام متاحة حالياً</p>
            }
        </div>
    </div>
</div>
