<section class="auth">
    <header class="page-head">
        <span class="page-num">ص ٣</span>
        <h2 class="page-title">
            افتح حساب
            <app-handwritten-underline />
        </h2>
        <p class="page-lede">
            املا البيانات، واختار إنك عميل أو وكيل دعم. التسجيل بياخد أقل من دقيقة.
        </p>
    </header>

    <form class="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
            <label class="field-label" for="rg-name">الاسم بالكامل</label>
            <input id="rg-name" type="text" class="field-input" [ngModel]="fullName()"
                (ngModelChange)="fullName.set($event)" name="fullName" autocomplete="name" placeholder="اكتب اسمك">
        </div>

        <div class="field">
            <label class="field-label" for="rg-email">الإيميل</label>
            <input id="rg-email" type="email" class="field-input" [ngModel]="email()"
                (ngModelChange)="email.set($event)" name="email" autocomplete="email" placeholder="you@example.com"
                dir="ltr">
        </div>

        <div class="field">
            <label class="field-label" for="rg-pass">كلمة المرور</label>
            <input id="rg-pass" type="password" class="field-input" [ngModel]="password()"
                (ngModelChange)="password.set($event)" name="password" autocomplete="new-password"
                placeholder="٦ حروف على الأقل">
        </div>

        <div class="field">
            <label class="field-label" for="rg-role">نوع الحساب</label>
            <select id="rg-role" class="field-input field-select" [ngModel]="role()" (ngModelChange)="role.set($event)"
                name="role">
                <option value="Customer">عميل</option>
                <option value="Agent">وكيل دعم</option>
            </select>
        </div>

        <div class="form-foot">
            <button type="submit" class="btn-primary" [disabled]="busy()">
                {{ busy() ? 'جاري التسجيل...' : 'سجّل' }}
            </button>
        </div>

        <p class="form-alt">
            عندك حساب بالفعل؟
            <a routerLink="/login" class="form-link">سجّل دخولك</a>
        </p>
    </form>
</section>
