<section class="auth">
    <header class="page-head">
        <span class="page-num">ص ٢</span>
        <h2 class="page-title">
            افتح الكشكول
            <app-handwritten-underline />
        </h2>
        <p class="page-lede">
            اكتب الإيميل وكلمة المرور، والكشكول هيتفتح على آخر صفحة كنت فيها.
        </p>
    </header>

    <form class="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
            <label class="field-label" for="lg-email">الإيميل</label>
            <input id="lg-email" type="email" class="field-input" [ngModel]="email()"
                (ngModelChange)="email.set($event)" name="email" autocomplete="email" placeholder="you@example.com"
                dir="ltr">
        </div>

        <div class="field">
            <label class="field-label" for="lg-pass">كلمة المرور</label>
            <input id="lg-pass" type="password" class="field-input" [ngModel]="password()"
                (ngModelChange)="password.set($event)" name="password" autocomplete="current-password"
                placeholder="••••••••">
        </div>

        <div class="form-foot">
            <button type="submit" class="btn-primary" [disabled]="busy()">
                {{ busy() ? 'جاري الفتح...' : 'افتح' }}
            </button>
        </div>

        <p class="form-alt">
            مش عندك حساب؟
            <a routerLink="/register" class="form-link">افتح حساب جديد</a>
        </p>
    </form>
</section>
