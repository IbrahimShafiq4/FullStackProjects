<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6">مهاراتي في SkillSwap</h1>

        <div class="bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-3">إضافة مهارة جديدة</h2>
            <div class="flex gap-2">
                <input id="skillNameInput" type="text" placeholder="اسم المهارة"
                    class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button onclick="addSkill()"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                    إضافة
                </button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-3">كل المهارات</h2>
            <ul id="skillsList" class="space-y-2">
            </ul>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-3">رفع صورة البروفايل</h2>
            <input id="userIdInput" type="number" placeholder="رقم اليوزر"
                class="border border-gray-300 rounded px-3 py-2 mb-2 w-full">
            <input id="imageInput" type="file" accept=".jpg,.jpeg,.png" class="mb-2 w-full">
            <button onclick="uploadImage()"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">
                رفع الصورة
            </button>
        </div>
    </div>
    <div id="customModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl w-80 p-6 modal-box">
            <div id="modalIcon" class="text-4xl mb-3 text-center"></div>
            <p id="modalMessage" class="text-gray-700 text-center mb-5"></p>
            <button onclick="closeModal()"
                class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
                حسنًا
            </button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/skills.js"></script>
</body>

</html>
