<header class="sticky top-0 z-50 bg-white border-b border-[#E2E8F0] h-16 flex items-center w-full">
    <div class="container mx-auto max-w-7xl px-4 sm:px-6 flex items-center justify-between">
        <a routerLink="/" class="text-xl font-bold text-[#0F172A] flex items-center gap-2">
            <span class="text-[#2563EB]">◆</span> Lost & Found
        </a>
        <div class="flex items-center gap-4 sm:gap-6">
            <app-theme-toggle />
            @if (isLoggedIn$ | async) {
            <span class="text-sm font-medium text-[#475569] hidden sm:inline">
                {{ (currentUser$ | async)?.displayName }}
            </span>
            <button (click)="onLogout()"
                class="text-sm font-medium text-[#2563EB] hover:text-[#1D4ED8] transition border-l border-[#E2E8F0] pl-4">
                خروج
            </button>
            } @else {
            <a routerLink="/login" class="text-sm font-medium text-[#2563EB] hover:text-[#1D4ED8] transition">دخول</a>
            <a routerLink="/register"
                class="text-sm font-medium bg-[#2563EB] text-white px-4 py-1.5 rounded-lg hover:bg-[#1D4ED8] transition">تسجيل</a>
            }
        </div>
    </div>
</header>
