<div class="bg-white rounded-xl border border-[#E2E8F0] shadow-sm p-6 mt-6">
    <h3 class="text-xl font-bold text-[#0F172A]">🔗 تطابقات محتملة</h3>

    @if (isLoading()) {
    <div class="flex justify-center py-8">
        <div class="w-6 h-6 border-4 border-[#2563EB] border-t-transparent rounded-full animate-spin"></div>
    </div>
    } @else if (matches().length === 0) {
    <p class="text-center text-[#64748B] py-8">لا توجد تطابقات حتى الآن</p>
    } @else {
    <div class="divide-y divide-[#E2E8F0] mt-4">
        @for (match of matches(); track match.id) {
        <div
            class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 py-4 first:pt-0 last:pb-0">
            <div class="flex-1 min-w-0">
                <p class="font-semibold text-[#0F172A]">{{ match.title }}</p>
                <p class="text-sm text-[#64748B] line-clamp-1">{{ match.description }}</p>
                <div class="flex flex-wrap gap-3 text-xs text-[#94A3B8] mt-1">
                    <span>📍 {{ match.location }}</span>
                    <span>👤 {{ match.createdByDisplayName }}</span>
                </div>
            </div>
            <button (click)="confirmMatch(match.id)" [disabled]="confirmingId() === match.id"
                class="px-4 py-1.5 rounded-lg bg-[#2563EB] text-white text-sm font-medium hover:bg-[#1D4ED8] transition disabled:opacity-50">
                {{ confirmingId() === match.id ? 'جاري...' : '✅ تطابق' }}
            </button>
        </div>
        }
    </div>
    }
</div>
