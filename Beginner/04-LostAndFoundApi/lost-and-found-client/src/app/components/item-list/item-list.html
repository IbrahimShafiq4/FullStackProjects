<div>
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
        <div>
            <h1 class="text-2xl sm:text-3xl font-bold text-[#0F172A]">البلاغات</h1>
            <p class="text-sm text-[#64748B] mt-1">جميع العناصر المفقودة والموجودة</p>
        </div>
        <button (click)="openCreateModal()"
            class="bg-[#2563EB] text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-[#1D4ED8] transition shadow-sm flex items-center gap-1.5">
            <span>+</span> إضافة بلاغ
        </button>
    </div>

    <div class="bg-white rounded-xl border border-[#E2E8F0] p-4 mb-6 shadow-sm">
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="flex-1">
                <app-search-bar (searchChanged)="onSearch($event)" />
            </div>
        </div>
    </div>

    @if (itemService.isLoading()) {
    <div class="flex justify-center py-12">
        <div class="w-8 h-8 border-4 border-[#2563EB] border-t-transparent rounded-full animate-spin"></div>
    </div>
    } @else if (itemService.items().length === 0) {
    <div class="bg-white rounded-xl border border-[#E2E8F0] p-12 text-center shadow-sm">
        <p class="text-lg font-medium text-[#475569]">لا توجد بلاغات</p>
        <p class="text-sm text-[#64748B] mt-1">كن أول من يضيف بلاغاً</p>
    </div>
    } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        @for (item of itemService.items(); track item.id) {
        <app-item-card [item]="item" />
        }
    </div>
    }
</div>

<app-modal [isOpen]="isCreateModalOpen()" (closed)="closeCreateModal()" title="بلاغ جديد">
    <app-create-item (itemCreated)="onItemCreated()" />
</app-modal>
