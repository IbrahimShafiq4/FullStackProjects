<div class="min-h-screen flex items-center justify-center bg-slate-900 dark:bg-slate-950">
    <form (ngSubmit)="submit()" class="bg-slate-800 p-8 rounded-2xl w-96">
        <h1 class="text-2xl font-bold mb-6 text-white">تسجيل الدخول</h1>

        @if (errorMessage()) {
        <p class="text-red-400 text-sm mb-3">{{ errorMessage() }}</p>
        }

        <input [(ngModel)]="email" name="email" type="email" placeholder="الإيميل"
            class="w-full p-3 rounded-lg bg-slate-700 text-white mb-3" />

        <input [(ngModel)]="password" name="password" type="password" placeholder="الباسورد"
            class="w-full p-3 rounded-lg bg-slate-700 text-white mb-4" />

        <button type="submit" [disabled]="isSubmitting()"
            class="w-full p-3 rounded-lg bg-sky-400 text-slate-900 font-bold hover:bg-sky-300 transition disabled:bg-slate-600">
            {{ isSubmitting() ? 'جاري الدخول...' : 'دخول' }}
        </button>

        <p class="text-slate-400 text-sm mt-4 text-center">
            معندكش حساب؟ <a routerLink="/register" class="text-sky-400 hover:underline">سجل دلوقتي</a>
        </p>
    </form>
</div>
