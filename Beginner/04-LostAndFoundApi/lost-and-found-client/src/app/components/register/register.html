<div class="min-h-screen flex items-center justify-center bg-[#F8FAFC] p-4">
    <div class="w-full max-w-md bg-white rounded-xl border border-[#E2E8F0] shadow-sm">
        <div class="border-b border-[#E2E8F0] px-6 py-4">
            <h1 class="text-2xl font-bold text-[#0F172A]">حساب جديد 🚀</h1>
            <p class="text-sm text-[#64748B]">أنشئ حسابك للبدء</p>
        </div>

        @if (errorMessage()) {
        <div class="mx-6 mt-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">{{ errorMessage() }}
        </div>
        }

        <form (ngSubmit)="submit()" class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-[#475569] mb-1">الاسم</label>
                <input [(ngModel)]="displayName" name="displayName" placeholder="اسمك"
                    class="w-full h-11 px-3 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition" />
            </div>
            <div>
                <label class="block text-sm font-medium text-[#475569] mb-1">الإيميل</label>
                <input [(ngModel)]="email" name="email" type="email" placeholder="example@email.com"
                    class="w-full h-11 px-3 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition" />
            </div>
            <div>
                <label class="block text-sm font-medium text-[#475569] mb-1">كلمة المرور</label>
                <input [(ngModel)]="password" name="password" type="password" placeholder="********"
                    class="w-full h-11 px-3 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition" />
            </div>
            <button type="submit" [disabled]="isSubmitting()"
                class="w-full h-11 bg-[#2563EB] text-white text-sm font-medium rounded-lg hover:bg-[#1D4ED8] transition disabled:opacity-50">
                {{ isSubmitting() ? 'جاري التسجيل...' : 'سجّل' }}
            </button>
        </form>

        <div class="border-t border-[#E2E8F0] px-6 py-4 text-center text-sm text-[#64748B]">
            لديك حساب؟ <a routerLink="/login" class="text-[#2563EB] hover:text-[#1D4ED8] font-medium">سجل دخولك</a>
        </div>
    </div>
</div>
