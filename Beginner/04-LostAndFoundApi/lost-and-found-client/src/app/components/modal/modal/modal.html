@if (isOpen) {
<div (click)="onBackdropClick($event)"
    class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 animate-fade-in">
    <div class="bg-slate-800 rounded-2xl p-6 w-96 max-w-[90vw] animate-scale-in">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-white">{{ title }}</h2>
            <button (click)="close()" class="text-slate-400 hover:text-white transition text-xl">✕</button>
        </div>

        <ng-content></ng-content>
    </div>
</div>
}
