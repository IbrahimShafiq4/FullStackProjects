<form (ngSubmit)="submit()" class="space-y-3 bg-slate-800 p-6 rounded-2xl">
    <h2 class="text-xl font-bold mb-2">بلاغ جديد</h2>

    @if (errorMessage()) {
    <p class="text-red-400 text-sm">{{ errorMessage() }}</p>
    }

    <select [(ngModel)]="type" name="type" class="w-full p-3 rounded-lg bg-slate-700">
        <option value="Found">لقيت حاجة</option>
        <option value="Lost">ضاع مني حاجة</option>
    </select>

    <input [(ngModel)]="title" name="title" placeholder="العنوان" class="w-full p-3 rounded-lg bg-slate-700" />

    <textarea [(ngModel)]="description" name="description" placeholder="الوصف"
        class="w-full p-3 rounded-lg bg-slate-700"></textarea>

    <input [(ngModel)]="category" name="category" placeholder="الفئة (إلكترونيات، مفاتيح...)"
        class="w-full p-3 rounded-lg bg-slate-700" />

    <input [(ngModel)]="location" name="location" placeholder="المكان" class="w-full p-3 rounded-lg bg-slate-700" />

    <input type="file" (change)="onFileSelected($event)" accept="image/*" class="w-full text-sm text-slate-300" />

    <button type="submit" [disabled]="isSubmitting()"
        class="w-full p-3 rounded-lg bg-sky-400 text-slate-900 font-bold hover:bg-sky-300 transition disabled:bg-slate-600">
        {{ isSubmitting() ? 'جاري الإرسال...' : 'إرسال البلاغ' }}
    </button>
</form>
