<form (ngSubmit)="submit()" class="space-y-4">
    @if (errorMessage()) {
    <div class="p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">{{ errorMessage() }}</div>
    }

    <div>
        <label class="block text-sm font-medium text-[#475569] mb-1">نوع البلاغ</label>
        <select [(ngModel)]="type" name="type"
            class="w-full h-11 px-3 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition">
            <option value="Found">لقيت حاجة</option>
            <option value="Lost">ضاع مني حاجة</option>
        </select>
    </div>

    <div>
        <label class="block text-sm font-medium text-[#475569] mb-1">العنوان</label>
        <input [(ngModel)]="title" name="title" placeholder="مثلاً: مفاتيح سيارة"
            class="w-full h-11 px-3 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition" />
    </div>

    <div>
        <label class="block text-sm font-medium text-[#475569] mb-1">الوصف</label>
        <textarea [(ngModel)]="description" name="description" rows="3" placeholder="تفاصيل أكثر..."
            class="w-full px-3 py-2 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition resize-none"></textarea>
    </div>

    <div>
        <label class="block text-sm font-medium text-[#475569] mb-1">الفئة</label>
        <input [(ngModel)]="category" name="category" placeholder="مفاتيح، إلكترونيات،..."
            class="w-full h-11 px-3 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition" />
    </div>

    <div>
        <label class="block text-sm font-medium text-[#475569] mb-1">المكان</label>
        <input [(ngModel)]="location" name="location" placeholder="المكان الذي وجدت/فقدت فيه"
            class="w-full h-11 px-3 bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg text-sm text-[#0F172A] placeholder:text-[#94A3B8] focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition" />
    </div>

    <div>
        <label class="block text-sm font-medium text-[#475569] mb-1">صورة (اختياري)</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*"
            class="w-full text-sm text-[#475569] file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-[#2563EB] file:text-white hover:file:bg-[#1D4ED8] transition" />
    </div>

    <button type="submit" [disabled]="isSubmitting()"
        class="w-full h-11 bg-[#2563EB] text-white text-sm font-medium rounded-lg hover:bg-[#1D4ED8] transition disabled:opacity-50">
        {{ isSubmitting() ? 'جاري الإرسال...' : 'إرسال البلاغ' }}
    </button>
</form>
