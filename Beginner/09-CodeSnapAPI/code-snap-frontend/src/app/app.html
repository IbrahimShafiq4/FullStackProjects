<div class="min-h-screen bg-gray-50 dark:bg-[#0B1120] transition-colors duration-300">

  <nav class="sticky top-0 z-40 bg-white/80 dark:bg-[#151f2e]/80 backdrop-blur-md
              border-b border-gray-200 dark:border-gray-800
              px-4 sm:px-6 py-3 flex justify-between items-center transition-colors duration-300">

    <h1 class="text-xl font-bold text-gray-900 dark:text-white tracking-tight">
      <span class="text-primary">Code</span>Snap
    </h1>

    <div class="flex items-center gap-3 sm:gap-4">

      @if (authService.currentUser()) {
      <span class="text-sm text-gray-600 dark:text-gray-300 font-medium hidden sm:inline">
        {{ authService.currentUser()?.fullName }}
      </span>
      <button (click)="authService.logout()" class="text-sm px-3 py-1.5 rounded-lg border border-red-300 dark:border-red-700
                        text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20
                        transition duration-200">
        تسجيل خروج
      </button>
      }

      <app-theme-toggle />
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <router-outlet />
  </main>

  <app-toast-container />
</div>
