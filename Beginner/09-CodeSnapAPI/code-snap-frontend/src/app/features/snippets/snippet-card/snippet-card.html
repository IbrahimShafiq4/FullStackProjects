<div appRevealOnScroll class="bg-white rounded-xl overflow-hidden shadow-md
            border border-gray-200 dark:border-[#2A333A] transition-colors duration-300">

    <div class="flex items-center justify-between px-4 py-3 bg-gray-50 dark:bg-[#1C2226]
                border-b border-gray-200 dark:border-[#2A333A]">
        <h3 class="font-mono text-sm text-gray-800 dark:text-gray-200">{{ snippet().title }}</h3>
        <span class="text-xs px-2 py-1 rounded-full bg-neon/10 text-white font-mono">
            {{ snippet().language }}
        </span>
    </div>

    @if (screenshotUrl()) {
    <img [src]="screenshotUrl()" [alt]="snippet().title" class="w-full h-40 object-cover">
    }

    <pre class="max-h-[450px] overflow-auto p-3 sm:p-4 text-xs leading-relaxed">
        <code
            appHighlightCode
            [code]="snippet().code"
            [language]="snippet().language">
        </code>
    </pre>

    <div class="flex gap-3 px-4 pb-4 py-3 bg-gray-50 dark:bg-[#1C2226]
                border-b border-gray-200 dark:border-[#2A333A] justify-around">
        <button (click)="copyCode()" style="font-size: 20px;"
            class="text-xs bg-neon/10 text-white text-3xl px-3 py-1.5 rounded-lg hover:bg-neon/20 transition">
            نسخ 📋
        </button>
        <a [routerLink]="['/snippets', snippet().id, 'edit']" style="font-size: 20px;" class="text-xs bg-gray-100 dark:bg-[#1C2226] text-gray-700 dark:text-gray-300
                px-3 py-1.5 rounded-lg hover:bg-gray-200 text-3xl dark:hover:bg-[#2A333A] transition">
            تعديل
        </a>
        <button (click)="onDelete.emit(snippet().id)" style="font-size: 20px;"
            class="text-xs bg-rose-500/10 text-rose-500 text-3xl px-3 py-1.5 rounded-lg hover:bg-rose-500/20 transition">
            حذف
        </button>
    </div>
</div>
