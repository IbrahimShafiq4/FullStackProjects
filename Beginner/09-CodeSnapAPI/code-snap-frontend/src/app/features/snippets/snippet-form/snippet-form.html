<form (ngSubmit)="onSubmit()"
    class="max-w-2xl mx-auto bg-white dark:bg-[#151f2e] rounded-2xl p-8 shadow-md border border-gray-100 dark:border-gray-800 space-y-5">

    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{ isEditMode() ? '✏️ تعديل Snippet' : '➕ Snippet جديد'
        }}</h1>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">العنوان</label>
        <input [formField]="snippetForm.title" type="text" placeholder="أدخل عنوان المقتطف" class="w-full bg-gray-50 dark:bg-[#0d121f] border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5
                    focus:ring-2 focus:ring-primary focus:border-transparent transition" />
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">اللغة</label>
        <select [formField]="snippetForm.language" class="w-full bg-gray-50 dark:bg-[#0d121f] border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5
                    focus:ring-2 focus:ring-primary">
            <option value="CSharp">C#</option>
            <option value="JavaScript">JavaScript</option>
            <option value="TypeScript">TypeScript</option>
            <option value="Python">Python</option>
            <option value="Html">HTML</option>
            <option value="Css">CSS</option>
            <option value="Sql">SQL</option>
        </select>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">الكود</label>
        <textarea [formField]="snippetForm.code" rows="8" placeholder="ألصق الكود هنا..." class="w-full bg-gray-50 dark:bg-[#0d121f] border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5 font-mono text-sm
                        focus:ring-2 focus:ring-primary focus:border-transparent transition"></textarea>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">صورة توضيحية (اختياري)</label>
        <input type="file" accept=".jpg,.jpeg,.png" (change)="onFileSelected($event)"
            class="w-full text-sm text-gray-600 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:bg-primary/10 file:text-primary hover:file:bg-primary/20 transition" />
        @if (selectedFile()) {
        <p class="mt-1 text-sm text-gray-500">📎 {{ selectedFile()!.name }}</p>
        }
    </div>

    <button type="submit" [disabled]="isSubmitting()"
        class="w-full bg-primary text-white py-3 rounded-lg font-semibold hover:bg-primary-dark transition disabled:opacity-50 shadow-md hover:shadow-lg">
        {{ isSubmitting() ? '⏳ جاري الحفظ...' : (isEditMode() ? '💾 حفظ التعديلات' : '🚀 إنشاء') }}
    </button>
</form>
