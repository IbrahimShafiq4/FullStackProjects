<!-- snippet-list.html -->
<div class="min-h-screen bg-gray-50 dark:bg-[#0B1120] px-4 py-8 transition-colors duration-300">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white tracking-tight">📘 CodeSnap</h1>
            <a routerLink="/snippets/new"
                class="bg-primary text-white px-5 py-2.5 rounded-lg font-medium hover:bg-primary-dark transition shadow-md hover:shadow-lg">
                + إضافة Snippet
            </a>
        </div>

        <!-- Search & Filter -->
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">🔍</span>
                <input [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="ابحث بالعنوان..."
                    class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-[#1a2332] border border-gray-200 dark:border-gray-700 rounded-lg
                      text-gray-800 dark:text-gray-200 placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent transition" />
            </div>
            <select [(ngModel)]="selectedLanguage" (change)="onSearch()" class="bg-white dark:bg-[#1a2332] border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-2.5
                        text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-primary">
                <option value="">كل اللغات</option>
                <option value="CSharp">C#</option>
                <option value="JavaScript">JavaScript</option>
                <option value="TypeScript">TypeScript</option>
                <option value="Python">Python</option>
                <option value="Html">HTML</option>
                <option value="Css">CSS</option>
                <option value="Sql">SQL</option>
            </select>
        </div>

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            @for (snippet of _Snippet.snippets(); track snippet.id) {
            <app-snippet-card [snippet]="snippet"
                [screenshotUrl]="snippet.screenshotUrl ? _Snippet.getFullScreenshotUrl(snippet.screenshotUrl) : null"
                (onDelete)="onDelete($event)" />
            } @empty {
            <p class="col-span-2 text-center text-gray-400 py-12">لا توجد مقتطفات بعد</p>
            }
        </div>
    </div>
</div>
