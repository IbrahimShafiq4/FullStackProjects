<div class="min-h-screen bg-gray-50 dark:bg-[#0D1117] px-6 py-10 transition-colors duration-300">
    <div class="max-w-3xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-mono text-gray-900 dark:text-white">CodeSnap</h1>
            <a routerLink="/snippets/new" class="bg-neon text-white px-4 py-2 rounded-lg font-mono text-sm font-semibold
                hover:opacity-90 transition">
                + Snippet جديد
            </a>
        </div>

        <div class="flex gap-3">
            <input [(ngModel)]="searchTerm" (input)="onSearch()" placeholder="بحث بالعنوان"
                class="flex-1 bg-white dark:bg-[#151A1E] border border-gray-200 dark:border-[#2A333A] rounded-lg px-4 py-2.5 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-neon transition" />
            <select [(ngModel)]="selectedLanguage" (change)="onSearch()"
                class="bg-white dark:bg-[#151A1E] border border-gray-200 dark:border-[#2A333A] rounded-lg px-4 py-2.5 text-gray-800 dark:text-gray-200">
                <option value="كل اللغات"></option>
                <option value="CSharp">C#</option>
                <option value="JavaScript">JavaScript</option>
                <option value="TypeScript">TypeScript</option>
                <option value="Python">Python</option>
                <option value="Html">HTML</option>
                <option value="Css">CSS</option>
                <option value="Sql">SQL</option>
            </select>
        </div>

        <div class="grid gap-5">
            @for (snippet of _Snippet.snippets(); track snippet.id) {
            <app-snippet-card [snippet]="snippet"
                [screenshotUrl]="snippet.screenshotUrl ? _Snippet.getFullScreenshotUrl(snippet.screenshotUrl) : null"
                (onDelete)="onDelete($event)" />
            } @empty {
            <p class="text-gray-400 text-center py-10">لسه مفيش snippets متسجلة</p>
            }
        </div>

    </div>
</div>
