<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow - تتبع مهامك اليومية</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/style.css" />

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'bounce-in': 'bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55)',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        bounceIn: {
                            '0%': { transform: 'scale(0.3)', opacity: '0' },
                            '50%': { transform: 'scale(1.05)' },
                            '70%': { transform: 'scale(0.9)' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="font-cairo bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-900 dark:to-gray-800 min-h-screen transition-colors duration-300">

    <div class="container mx-auto px-4 py-6 max-w-4xl">

        <header class="flex justify-between items-center mb-8 animate-slide-up">
            <div class="flex items-center gap-3">
                <div
                    class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fas fa-tasks text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-extrabold text-gray-800 dark:text-white">
                        Task<span class="text-blue-600 dark:text-blue-400">Flow</span>
                    </h1>
                    <p class="text-xs text-gray-500 dark:text-gray-400 -mt-1">تتبع إنجازك اليومي</p>
                </div>
            </div>

            <button id="themeToggle"
                class="relative w-14 h-8 bg-gray-200 dark:bg-gray-700 rounded-full transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-100 dark:focus:ring-offset-gray-800 shadow-lg">
                <span id="themeIcon"
                    class="absolute top-1 left-1 w-6 h-6 bg-white rounded-full shadow-md transform transition-transform duration-300 flex items-center justify-center text-sm dark:translate-x-6">
                    🌙
                </span>
            </button>
        </header>

        <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 animate-fade-in">
            <div
                class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-5 border border-gray-100 dark:border-gray-700 hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">🔥 Streak الحالي</p>
                        <p id="currentStreak" class="text-3xl font-extrabold text-orange-500 mt-1">0</p>
                    </div>
                    <div
                        class="w-12 h-12 bg-orange-100 dark:bg-orange-900/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-fire text-orange-500 text-xl"></i>
                    </div>
                </div>
            </div>

            <div
                class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-5 border border-gray-100 dark:border-gray-700 hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">🏆 أطول Streak</p>
                        <p id="longestStreak" class="text-3xl font-extrabold text-green-500 mt-1">0</p>
                    </div>
                    <div
                        class="w-12 h-12 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-trophy text-green-500 text-xl"></i>
                    </div>
                </div>
            </div>

            <div
                class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-5 border border-gray-100 dark:border-gray-700 hover:shadow-xl transition-all duration-300 hover:-translate-y-1">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 dark:text-gray-400">📋 إجمالي المهام</p>
                        <p id="totalTasks" class="text-3xl font-extrabold text-blue-500 mt-1">0</p>
                    </div>
                    <div
                        class="w-12 h-12 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-list-check text-blue-500 text-xl"></i>
                    </div>
                </div>
            </div>
        </section>

        <section
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 mb-6 border border-gray-100 dark:border-gray-700 animate-slide-up transition-all duration-300">
            <div class="flex items-center gap-2 mb-4">
                <i class="fas fa-plus-circle text-blue-600 dark:text-blue-400 text-xl"></i>
                <h2 class="text-lg font-bold text-gray-800 dark:text-white">إضافة مهمة جديدة</h2>
            </div>

            <form id="taskForm" class="flex flex-col md:flex-row gap-3">
                <div class="flex-1 relative">
                    <i
                        class="fas fa-pen absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="text" id="taskTitle" placeholder="اكتب عنوان المهمة..."
                        class="w-full pr-10 pl-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" />
                </div>

                <div class="w-full md:w-40 relative">
                    <i
                        class="fas fa-user absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500"></i>
                    <input type="number" id="userStreakId" placeholder="User ID" value="2"
                        class="w-full pr-10 pl-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300" />
                </div>

                <button type="submit"
                    class="px-8 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold rounded-xl transition-all duration-300 shadow-lg shadow-blue-500/30 hover:shadow-xl hover:shadow-blue-500/40 transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i>
                    أضف
                </button>
            </form>
        </section>

        <section
            class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 border border-gray-100 dark:border-gray-700 animate-fade-in">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <i class="fas fa-tasks text-blue-600 dark:text-blue-400 text-xl"></i>
                    <h2 class="text-lg font-bold text-gray-800 dark:text-white">قائمة المهام</h2>
                </div>
                <span id="tasksCount"
                    class="text-sm text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-700 px-3 py-1 rounded-full">0
                    مهام</span>
            </div>

            <div id="tasksList" class="space-y-3 min-h-[200px]">
                <div class="text-center py-12 text-gray-400 dark:text-gray-500">
                    <i class="fas fa-inbox text-4xl mb-3 block"></i>
                    <p>مفيش مهام حالياً</p>
                    <p class="text-sm">أضف أول مهمة لتبدأ رحلتك!</p>
                </div>
            </div>
        </section>
    </div>

    <script src="js/api.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/streak.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
