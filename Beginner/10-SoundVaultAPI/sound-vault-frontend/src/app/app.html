<div class="min-h-screen bg-gray-50 dark:bg-[#0D1117] transition-colors duration-300">
    <nav
        class="bg-white dark:bg-[#151A1E] border-b border-gray-200 dark:border-[#2A333A] px-6 py-4 flex justify-between items-center transition-colors duration-300">
        <h1 class="text-xl font-bold text-gray-800 dark:text-white">🎧 SoundVault</h1>

        <div class="flex items-center gap-4">
            @if (_Auth.currentUser()) {
            <span class="text-gray-600 dark:text-gray-400 text-sm">
                {{ _Auth.currentUser()?.fullName }}
            </span>
            <button (click)="_Auth.logout()" class="text-rose-500 text-sm hover:underline">خروج</button>
            }
            <app-theme-toggle />
        </div>
    </nav>

    <router-outlet />
    <app-toast-container />
</div>
