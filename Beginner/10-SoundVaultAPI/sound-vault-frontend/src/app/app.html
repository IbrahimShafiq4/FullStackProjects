<div dir="rtl" class="min-h-screen bg-[var(--bg-primary)] transition-colors duration-200">
    <nav
        class="bg-[var(--bg-nav)] border-b border-[var(--border-color)] px-6 py-3 flex justify-between items-center transition-colors duration-200">
        <h1 class="text-xl font-bold text-[var(--text-primary)]">🎧 SoundVault</h1>
        <div class="flex items-center gap-4">
            @if (_Auth.currentUser()) {
            <span class="text-sm text-[var(--text-secondary)]">{{ _Auth.currentUser()?.fullName }}</span>
            <button (click)="_Auth.logout()" class="text-sm text-[var(--accent)] hover:underline">خروج</button>
            }
            <app-theme-toggle />
        </div>
    </nav>
    <router-outlet />
    <app-toast-container />
</div>
