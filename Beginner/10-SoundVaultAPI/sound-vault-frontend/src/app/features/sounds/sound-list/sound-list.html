<div class="min-h-screen bg-[var(--bg-primary)] px-6 py-10 transition-colors duration-200">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold text-[var(--text-primary)]">🎧 مكتبة الأصوات</h1>
            <a routerLink="/sounds/new"
                class="bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white px-4 py-2 rounded-[var(--radius)] transition text-sm">+
                إضافة صوت</a>
        </div>
        <div class="flex flex-wrap gap-3">
            <input [(ngModel)]="searchTerm" (input)="onFilter()" placeholder="بحث بالعنوان أو الوصف..."
                class="flex-1 bg-[var(--bg-secondary)] border border-[var(--border-color)] rounded-[var(--radius)] px-4 py-2 text-[var(--text-primary)] focus:outline-none focus:ring-1 focus:ring-[var(--accent)] transition" />
            <select [(ngModel)]="selectedCategory" (change)="onFilter()"
                class="bg-[var(--bg-secondary)] border border-[var(--border-color)] rounded-[var(--radius)] px-4 py-2 text-[var(--text-primary)] focus:outline-none focus:ring-1 focus:ring-[var(--accent)] transition">
                <option value="">كل التصنيفات</option>
                <option value="Calm">🌊 هدوء</option>
                <option value="Laughter">😂 ضحك</option>
                <option value="Music">🎵 موسيقى</option>
                <option value="Nature">🌿 طبيعة</option>
                <option value="Scream">😱 صرخة</option>
                <option value="Speech">🗣️ حديث</option>
                <option value="Other">🎧 أخرى</option>
            </select>
        </div>
        <div class="grid gap-4">
            @for (sound of _Sounds.sounds(); track sound.id) {
            <app-sound-card [sound]="sound" [mediaFullUrl]="_Sounds.getFullMediaUrl(sound.mediaUrl)"
                (onDelete)="onDelete($event)" />
            } @empty {
            <p class="text-center text-[var(--text-muted)] py-10">لا توجد أصوات مسجلة بعد... أضف أول صوت!</p>
            }
        </div>
    </div>
</div>
