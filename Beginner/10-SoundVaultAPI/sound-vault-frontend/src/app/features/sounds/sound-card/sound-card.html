<div
    class="bg-white dark:bg-[#151A1E] rounded-xl overflow-hidden shadow-md border border-gray-200 dark:border-[#2A333A] transition-all hover:shadow-lg">
    <div class="p-4 flex justify-between items-start border-b border-gray-100 dark:border-[#2A333A]">
        <div>
            <h3 class="font-semibold text-gray-800 dark:text-gray-200">{{ sound().title }}</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">{{ sound().description }}</p>
        </div>
        <span class="text-2xl">{{ sound().categoryEmoji }}</span>
    </div>

    @if (sound().mediaType === 'Image') {
    <img [src]="mediaFullUrl()" alt="{{ sound().title }}" class="w-full max-h-64 object-cover">
    } @else if (sound().mediaType === 'Audio') {
    <audio controls class="p-2">
        <source [src]="mediaFullUrl()" type="audio/mpeg">
        متصفحك لا يدعم تشغيل الصوت.
    </audio>
    } @else if (sound().mediaType === 'Video') {
    <video controls class="p-2" muted>
        <source [src]="mediaFullUrl()" type="video/mp4">
        متصفحك لا يدعم تشغيل الفيديو.
    </video>
    }

    <div class="p-4 flex gap-3 text-sm flex-wrap">
        <button (click)="copyTitle()"
            class="bg-blue-500/10 text-blue-600 dark:text-blue-400 px-3 py-1 rounded-lg hover:bg-blue-500/20 transition">
            نسخ العنوان 📋
        </button>
        <a [routerLink]="['/sounds', sound().id, 'edit']"
            class="bg-yellow-500/10 text-yellow-600 dark:text-yellow-400 px-3 py-1 rounded-lg hover:bg-yellow-500/20 transition">
            تعديل ✏️
        </a>
        <button (click)="onDelete.emit(sound().id)"
            class="bg-rose-500/10 text-rose-500 px-3 py-1 rounded-lg hover:bg-rose-500/20 transition">
            حذف
        </button>
    </div>
</div>
