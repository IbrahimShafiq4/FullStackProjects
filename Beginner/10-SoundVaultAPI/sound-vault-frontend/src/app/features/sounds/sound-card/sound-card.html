<div
    class="bg-[var(--bg-secondary)] rounded-[var(--radius)] shadow-[var(--shadow-sm)] border border-[var(--border-color)] overflow-hidden transition hover:shadow-[var(--shadow-md)]">
    <div class="p-4 flex justify-between items-start border-b border-[var(--border-color)]">
        <div>
            <h3 class="font-semibold text-[var(--text-primary)]">{{ sound().title }}</h3>
            <p class="text-sm text-[var(--text-secondary)]">{{ sound().description }}</p>
        </div>
        <span class="text-2xl">{{ sound().categoryEmoji }}</span>
    </div>
    @if (sound().mediaType === 'Image') {
    <img [src]="mediaFullUrl()" alt="{{ sound().title }}" class="w-full max-h-64 object-cover">
    } @else if (sound().mediaType === 'Audio') {
    <audio controls class="w-full p-2">
        <source [src]="mediaFullUrl()" type="audio/mpeg">
    </audio>
    } @else if (sound().mediaType === 'Video') {
    <video controls class="w-full p-2" muted>
        <source [src]="mediaFullUrl()" type="video/mp4">
    </video>
    }
    <div class="p-4 flex flex-wrap gap-2 text-sm">
        <button (click)="copyTitle()"
            class="bg-[var(--accent)]/10 text-[var(--accent)] px-3 py-1 rounded-[var(--radius)] hover:bg-[var(--accent)]/20 transition">نسخ
            العنوان</button>
        <button (click)="toggleLike()"
            class="bg-[var(--accent)]/10 text-[var(--accent)] px-3 py-1 rounded-[var(--radius)] hover:bg-[var(--accent)]/20 transition">
            {{ sound().isLiked ? '❤️' : '🤍' }} {{ sound().likeCount || 0 }}
        </button>
        <button (click)="openComments()"
            class="bg-[var(--accent)]/10 text-[var(--accent)] px-3 py-1 rounded-[var(--radius)] hover:bg-[var(--accent)]/20 transition">💬
            {{ sound().commentCount || 0 }}</button>
        <a [routerLink]="['/sounds', sound().id, 'edit']"
            class="bg-[var(--accent)]/10 text-[var(--accent)] px-3 py-1 rounded-[var(--radius)] hover:bg-[var(--accent)]/20 transition">تعديل</a>
        <button (click)="onDelete.emit(sound().id)"
            class="bg-red-500/10 text-red-500 px-3 py-1 rounded-[var(--radius)] hover:bg-red-500/20 transition">حذف</button>
    </div>
</div>
