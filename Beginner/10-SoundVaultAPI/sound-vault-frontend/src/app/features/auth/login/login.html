<div class="min-h-screen flex items-center justify-center bg-[var(--bg-primary)] px-4 transition-colors duration-200">
    <form (ngSubmit)="onSubmit()"
        class="bg-[var(--bg-secondary)] p-8 rounded-[var(--radius)] shadow-[var(--shadow-md)] w-96 border border-[var(--border-color)] transition-colors duration-200">
        <h1 class="text-2xl font-bold text-[var(--text-primary)] text-center mb-6">تسجيل الدخول</h1>
        <input [(ngModel)]="model.email" name="email" type="email" placeholder="البريد الإلكتروني"
            class="w-full bg-[var(--bg-input)] border border-[var(--border-color)] text-[var(--text-primary)] rounded-[var(--radius)] px-4 py-2.5 mb-3 focus:outline-none focus:ring-1 focus:ring-[var(--accent)] transition" />
        <input [(ngModel)]="model.password" name="password" type="password" placeholder="كلمة المرور"
            class="w-full bg-[var(--bg-input)] border border-[var(--border-color)] text-[var(--text-primary)] rounded-[var(--radius)] px-4 py-2.5 mb-3 focus:outline-none focus:ring-1 focus:ring-[var(--accent)] transition" />
        <button type="submit"
            class="w-full bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white py-2.5 rounded-[var(--radius)] font-semibold transition">دخول</button>
        <p class="text-center text-sm text-[var(--text-secondary)] mt-5">ليس لديك حساب؟ <a routerLink="/register"
                class="text-[var(--accent)] hover:underline">سجل جديد</a></p>
    </form>
</div>
