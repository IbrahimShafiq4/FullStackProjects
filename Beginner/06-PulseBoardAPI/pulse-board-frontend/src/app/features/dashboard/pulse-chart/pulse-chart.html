<div class="bg-[#1A1D24] rounded-2xl p-6 border border-white/5">

    <!-- Legend -->
    <div class="flex gap-4 mb-6 text-sm">

        <!-- Mood -->
        <span class="flex items-center gap-2 text-gray-300">
            <span class="w-3 h-3 rounded-full bg-violet-500"></span>
            المزاج
        </span>

        <!-- Focus -->
        <span class="flex items-center gap-2 text-gray-300">
            <span class="w-3 h-3 rounded-full bg-pink-500"></span>
            التركيز
        </span>

    </div>


    <!-- Chart -->
    <div class="w-full overflow-hidden">

        <svg viewBox="0 0 600 240" class="w-full h-auto" preserveAspectRatio="none">

            <!-- ========================= -->
            <!-- Horizontal Grid -->
            <!-- ========================= -->

            <line x1="20" y1="20" x2="580" y2="20" class="grid-line" />

            <line x1="20" y1="60" x2="580" y2="60" class="grid-line" />

            <line x1="20" y1="100" x2="580" y2="100" class="grid-line" />

            <line x1="20" y1="140" x2="580" y2="140" class="grid-line" />

            <line x1="20" y1="180" x2="580" y2="180" class="grid-line" />


            <!-- ========================= -->
            <!-- Mood Line -->
            <!-- ========================= -->

            <path [attr.d]="moodPath()" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round" class="chart-line mood-line" />


            <!-- ========================= -->
            <!-- Focus Line -->
            <!-- ========================= -->

            <path [attr.d]="focusPath()" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round"
                stroke-linejoin="round" class="chart-line focus-line" />


            <!-- ========================= -->
            <!-- Mood Points -->
            <!-- ========================= -->

            @for (point of moodPoints(); track $index) {

            <circle [attr.cx]="point.x" [attr.cy]="point.y" r="5" fill="#8B5CF6" class="chart-point" />

            }


            <!-- ========================= -->
            <!-- Focus Points -->
            <!-- ========================= -->

            @for (point of focusPoints(); track $index) {

            <circle [attr.cx]="point.x" [attr.cy]="point.y" r="5" fill="#EC4899" class="chart-point" />

            }


            <!-- ========================= -->
            <!-- X Axis Labels -->
            <!-- ========================= -->

            @if (data(); as chartData) {

            @for (
            label of chartData.labels;
            track $index
            ) {

            <text [attr.x]="
                            chartData.labels.length === 1
                                ? 300
                                : 20 +
                                  ($index *
                                    (560 / (chartData.labels.length - 1)))
                        " y="225" text-anchor="middle" class="chart-label">
                {{ label }}
            </text>

            }

            }

        </svg>

    </div>

</div>
