<div class="bg-[#1A1D24] rounded-2xl p-6 border border-white/5">
    <div class="flex gap-4 mb-4 text-sm">
        <span class="flex items-center gap-2 text-gray-300">
            <span class="w-3 h-3 rounded-full bg-violet-500"></span> المزاج
        </span>
        <span class="flex items-center gap-2 text-gray-300">
            <span class="w-3 h-3 rounded-full bg-pink-500"></span> التركيز
        </span>
    </div>

    <svg viewBox="0 0 600 200" class="w-full">
        <path [attr.d]="moodPath()" fill="none" stroke="#8B5CF6" stroke-width="3" class="chart-line"
            style="stroke-dasharray: 2000; animation-delay: 0s" />

        <path [attr.d]="focusPath()" fill="none" stroke="#EC4899" stroke-width="3" class="chart-line"
            style="stroke-dasharray: 2000; animation-delay: 0.3s" />
    </svg>
</div>
