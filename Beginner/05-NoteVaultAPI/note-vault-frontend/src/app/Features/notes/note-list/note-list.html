<app-note-form />

<div class="max-w-2xl mx-auto p-6 space-y-3">
    @for (note of _NotesService.notes(); track note.id) {
    <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow flex justify-between items-start">
        <div>
            <h3 class="font-semibold text-gray-800 dark:text-white">{{ note.title }}</h3>
            <p class="text-gray-600 dark:text-gray-300 text-sm mt-1">{{ note.content }}</p>
        </div>
        <button (click)="onDelete(note.id)" class="text-red-500 hover:text-red-700 text-sm">
            حذف
        </button>
    </div>
    } @empty {
    <p class="text-gray-400 text-center">لسه مفيش ملاحظات</p>
    }
</div>
