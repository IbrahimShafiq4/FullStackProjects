<div class="auth-screen">

    <div class="auth-sky">
        <div class="auth-sun"></div>
        <div class="auth-cloud cloud-1"><span></span><span></span><span></span></div>
        <div class="auth-cloud cloud-2"><span></span><span></span></div>
        <div class="auth-bird bird-1"><span></span><span></span></div>
        <div class="auth-bird bird-2"><span></span><span></span></div>
    </div>

    <div class="auth-board">
        <div class="board-frame">
            <div class="board-surface">

                <div class="board-corner corner-tl">
                    <div class="screw"></div>
                </div>
                <div class="board-corner corner-tr">
                    <div class="screw"></div>
                </div>
                <div class="board-corner corner-bl">
                    <div class="screw"></div>
                </div>
                <div class="board-corner corner-br">
                    <div class="screw"></div>
                </div>

                <div class="board-header">
                    <span class="board-label">STREAMVAULT</span>
                    <span class="board-title">الدخول للفصل</span>
                </div>

                <form (ngSubmit)="onSubmit()" class="board-form">
                    <div class="field">
                        <label class="field-label" for="email">البريد الإلكتروني</label>
                        <input id="email" [formField]="loginForm.email" type="email" class="field-input"
                            autocomplete="email" placeholder="example@streamvault.com">
                    </div>

                    <div class="field">
                        <label class="field-label" for="password">كلمة المرور</label>
                        <input id="password" [formField]="loginForm.password" type="password" class="field-input"
                            autocomplete="current-password" placeholder="••••••••">
                    </div>

                    <button type="submit" class="btn btn-accent submit-btn" [disabled]="isLoading()">
                        @if (isLoading()) {
                        <span class="spinner"></span>
                        <span>جاري الدخول...</span>
                        } @else {
                        <span>دخول الفصل</span>
                        }
                    </button>
                </form>

                <p class="board-footer">
                    مش عندك حساب؟
                    <a routerLink="/register" class="board-link">سجّل حساب جديد</a>
                </p>

                <div class="board-chalk-tray">
                    <div class="chalk-piece piece-white"></div>
                    <div class="chalk-piece piece-yellow"></div>
                    <div class="chalk-piece piece-pink"></div>
                    <div class="eraser">
                        <div class="eraser-top"></div>
                        <div class="eraser-bottom"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
