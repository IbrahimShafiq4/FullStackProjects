<div class="video-previewer" [class.vp-fullscreen]="isFullscreen()">

    <div class="vp-ceiling">
        <div class="ceiling-line"></div>
        <div class="ceiling-lamp lamp-left">
            <div class="lamp-cord"></div>
            <div class="lamp-shade"></div>
            <div class="lamp-glow"></div>
        </div>
        <div class="ceiling-lamp lamp-center">
            <div class="lamp-cord"></div>
            <div class="lamp-shade"></div>
            <div class="lamp-glow"></div>
        </div>
        <div class="ceiling-lamp lamp-right">
            <div class="lamp-cord"></div>
            <div class="lamp-shade"></div>
            <div class="lamp-glow"></div>
        </div>
    </div>

    <div class="vp-frame">

        <div class="vp-side-decor side-left">
            <svg class="tree-svg" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="trunk-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#8b5a2b" />
                        <stop offset="100%" stop-color="#3d2612" />
                    </linearGradient>
                    <radialGradient id="leaf-grad-1" cx="40%" cy="30%" r="60%">
                        <stop offset="0%" stop-color="#5a8a3a" />
                        <stop offset="60%" stop-color="#3d6b28" />
                        <stop offset="100%" stop-color="#2a5018" />
                    </radialGradient>
                </defs>
                <rect x="46" y="140" width="8" height="55" fill="url(#trunk-grad-1)" rx="2" />
                <ellipse cx="50" cy="100" rx="40" ry="55" fill="url(#leaf-grad-1)" />
                <ellipse cx="30" cy="80" rx="25" ry="30" fill="#4a7a2a" opacity="0.5" />
                <ellipse cx="70" cy="110" rx="22" ry="28" fill="#2a5018" opacity="0.5" />
            </svg>
            <svg class="tree-svg tree-svg-2" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                <rect x="46" y="140" width="8" height="55" fill="url(#trunk-grad-1)" rx="2" />
                <ellipse cx="50" cy="100" rx="38" ry="52" fill="url(#leaf-grad-1)" />
                <ellipse cx="32" cy="85" rx="22" ry="26" fill="#4a7a2a" opacity="0.5" />
            </svg>
            <svg class="tree-svg tree-svg-3" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                <rect x="46" y="140" width="8" height="55" fill="url(#trunk-grad-1)" rx="2" />
                <ellipse cx="50" cy="100" rx="36" ry="50" fill="url(#leaf-grad-1)" />
                <ellipse cx="68" cy="90" rx="20" ry="24" fill="#2a5018" opacity="0.5" />
            </svg>
        </div>

        <div class="vp-side-decor side-right">
            <svg class="tree-svg" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                <rect x="46" y="140" width="8" height="55" fill="url(#trunk-grad-1)" rx="2" />
                <ellipse cx="50" cy="100" rx="38" ry="52" fill="url(#leaf-grad-1)" />
                <ellipse cx="32" cy="85" rx="22" ry="26" fill="#4a7a2a" opacity="0.5" />
            </svg>
            <svg class="tree-svg tree-svg-2" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                <rect x="46" y="140" width="8" height="55" fill="url(#trunk-grad-1)" rx="2" />
                <ellipse cx="50" cy="100" rx="40" ry="55" fill="url(#leaf-grad-1)" />
                <ellipse cx="70" cy="105" rx="20" ry="24" fill="#2a5018" opacity="0.5" />
            </svg>
            <svg class="tree-svg tree-svg-3" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                <rect x="46" y="140" width="8" height="55" fill="url(#trunk-grad-1)" rx="2" />
                <ellipse cx="50" cy="100" rx="36" ry="48" fill="url(#leaf-grad-1)" />
                <ellipse cx="28" cy="95" rx="18" ry="22" fill="#4a7a2a" opacity="0.5" />
            </svg>
        </div>

        <div class="vp-corner corner-tl">
            <div class="screw"></div>
        </div>
        <div class="vp-corner corner-tr">
            <div class="screw"></div>
        </div>
        <div class="vp-corner corner-bl">
            <div class="screw"></div>
        </div>
        <div class="vp-corner corner-br">
            <div class="screw"></div>
        </div>

        <div class="vp-header">
            <div class="vp-header-left">
                <div class="vp-header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="18"
                        height="18">
                        <rect x="2" y="6" width="14" height="12" rx="2" />
                        <path d="M22 8l-6 4 6 4z" />
                    </svg>
                </div>
                <span class="vp-title">{{ title() }}</span>
            </div>
            <div class="vp-header-right">
                <div class="vp-live-dot" [class.vp-live-pulse]="isPlaying()"></div>
                <span class="vp-status">{{ isPlaying() ? 'يعمل الآن' : 'متوقف' }}</span>
                <button class="vp-icon-btn" (click)="onToggleFullscreen()" aria-label="ملء الشاشة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="16"
                        height="16">
                        <path
                            d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="vp-body">

            <div class="vp-side-strip strip-left">
                <div class="strip-pattern"></div>
            </div>

            <div class="vp-side-strip strip-right">
                <div class="strip-pattern"></div>
            </div>

            @if (hasError()) {
            <div class="vp-error">
                <div class="vp-error-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="40"
                        height="40">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 8v4M12 16h.01" />
                    </svg>
                </div>
                <p class="vp-error-text">مش قادرين نشغل الفيديو ده</p>
                <p class="vp-error-hint">جرب تعمل تحديث للصفحة أو كلم المدرس</p>
            </div>
            } @else {
            <video #videoEl controls preload="metadata" playsinline [src]="videoSrc" (loadeddata)="onLoaded()"
                (error)="onError()" (play)="onPlay()" (pause)="onPause()" class="vp-video">
            </video>

            @if (isLoading()) {
            <div class="vp-loading">
                <div class="vp-loading-scene">
                    <div class="loading-desk">
                        <div class="loading-desk-top"></div>
                        <div class="loading-desk-legs">
                            <div class="loading-leg"></div>
                            <div class="loading-leg"></div>
                        </div>
                    </div>
                    <div class="loading-book">
                        <div class="loading-book-cover"></div>
                        <div class="loading-book-pages"></div>
                    </div>
                    <div class="loading-chalk">
                        <div class="chalk-piece"></div>
                        <div class="chalk-piece"></div>
                    </div>
                </div>
                <div class="vp-spinner"></div>
                <span class="vp-loading-text">جاري تحميل الفيديو...</span>
            </div>
            }
            }

            <div class="vp-bottom-decor">
                <svg viewBox="0 0 800 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0,40 Q100,20 200,35 T400,30 T600,38 T800,32 L800,60 L0,60 Z" fill="rgba(0,0,0,0.15)" />
                </svg>
            </div>
        </div>

        <div class="vp-chalk-tray">
            <div class="chalk-piece piece-white"></div>
            <div class="chalk-piece piece-yellow"></div>
            <div class="chalk-piece piece-pink"></div>
            <div class="chalk-piece piece-green"></div>
            <div class="eraser">
                <div class="eraser-top"></div>
                <div class="eraser-bottom"></div>
            </div>
        </div>
    </div>

    <div class="vp-grass-decor">
        <svg class="grass-svg" viewBox="0 0 1200 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grass-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#7ba862" />
                    <stop offset="100%" stop-color="#3d5a30" />
                </linearGradient>
            </defs>
            <path
                d="M0,50 Q50,30 100,45 T200,42 T300,48 T400,40 T500,47 T600,44 T700,50 T800,45 T900,48 T1000,42 T1100,46 T1200,44 L1200,80 L0,80 Z"
                fill="url(#grass-grad-1)" />
        </svg>

        <div class="flower flower-1">
            <div class="flower-petals">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="flower-center"></div>
            <div class="flower-stem"></div>
        </div>
        <div class="flower flower-2">
            <div class="flower-petals">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="flower-center"></div>
            <div class="flower-stem"></div>
        </div>
        <div class="flower flower-3">
            <div class="flower-petals">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="flower-center"></div>
            <div class="flower-stem"></div>
        </div>
        <div class="flower flower-4">
            <div class="flower-petals">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="flower-center"></div>
            <div class="flower-stem"></div>
        </div>
        <div class="flower flower-5">
            <div class="flower-petals">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="flower-center"></div>
            <div class="flower-stem"></div>
        </div>
        <div class="flower flower-6">
            <div class="flower-petals">
                <span></span><span></span><span></span><span></span>
            </div>
            <div class="flower-center"></div>
            <div class="flower-stem"></div>
        </div>

        <div class="grass-tuft tuft-1"></div>
        <div class="grass-tuft tuft-2"></div>
        <div class="grass-tuft tuft-3"></div>
        <div class="grass-tuft tuft-4"></div>
        <div class="grass-tuft tuft-5"></div>
    </div>

    <div class="vp-sky-decor">
        <div class="vp-cloud cloud-1">
            <div class="cloud-puff"></div>
            <div class="cloud-puff"></div>
            <div class="cloud-puff"></div>
        </div>
        <div class="vp-cloud cloud-2">
            <div class="cloud-puff"></div>
            <div class="cloud-puff"></div>
        </div>
        <div class="vp-bird bird-1">
            <span></span><span></span>
        </div>
        <div class="vp-bird bird-2">
            <span></span><span></span>
        </div>
    </div>

</div>
