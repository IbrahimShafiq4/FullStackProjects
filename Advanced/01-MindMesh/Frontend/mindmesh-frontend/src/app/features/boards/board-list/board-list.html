<div class="min-h-screen bg-surface-muted px-4 py-10">
    <div class="max-w-5xl mx-auto" dir="rtl">
        <h1 class="text-start text-3xl font-black text-gray-900 mb-6">لوحاتي</h1>
        <div class="flex gap-3 mb-8">
            <input [value]="newTitle()" (input)="newTitle.set($any($event.target).value)"
                placeholder="اسم اللوحة الجديدة"
                class="flex-1 bg-white border border-surface-border rounded-lg px-4 py-3 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-300 transition-shadow">
            <button (click)="onCreate()"
                class="bg-brand-500 hover:bg-brand-600 text-white font-semibold px-6 py-3 rounded-lg transition-colors shadow-apple">إنشاء</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3">
            @for (board of _BoardsService.boards(); track board.id) {
            <a [routerLink]="['/boards', board.id, 'details']"
                class="group bg-white rounded-lg p-5 shadow-apple border border-surface-border hover:shadow-apple-lg transition-all hover:-translate-y-0.5 flex flex-col items-start">
                <h3 class="text-lg font-bold text-gray-900 group-hover:text-brand-600 transition-colors">{{ board.title
                    }}</h3>
                <p class="text-sm text-gray-500 mt-1">{{ board.cardsCount }} بطاقة</p>
                <div
                    class="mt-3 text-sm text-brand-500 font-medium opacity-0 group-hover:opacity-100 transition-opacity">
                    عرض التفاصيل ←</div>
            </a>
            }
        </div>
    </div>
</div>
