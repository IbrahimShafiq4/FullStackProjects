<div class="min-h-screen relative overflow-hidden" (mousemove)="onDrag($event)" (mouseup)="onDragEnd()">
    <div class="absolute inset-0 pointer-events-none"
        style="background-image: linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px); background-size: 40px 40px;">
    </div>

    <div
        class="absolute top-4 right-4 left-4 z-10 flex flex-wrap gap-2 items-center bg-white/80 backdrop-blur-sm p-2 rounded-lg shadow-apple border border-surface-border">
        <a routerLink="/boards" class="text-gray-500 hover:text-gray-900 text-sm font-medium transition-colors">←
            رجوع</a>
        <input [value]="newCardText()" (input)="newCardText.set($any($event.target).value)" placeholder="بطاقة جديدة..."
            class="flex-1 min-w-[120px] bg-white border border-surface-border rounded-lg px-3 py-2 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-300 transition-shadow">
        <input type="color" [(ngModel)]="selectedColor"
            class="w-8 h-8 p-1 border border-surface-border rounded-lg cursor-pointer" title="لون البطاقة" />
        <input type="color" [(ngModel)]="selectedStrokeColor"
            class="w-8 h-8 p-1 border border-surface-border rounded-lg cursor-pointer" title="لون الخط" />
        <button (click)="onCreateCard()"
            class="bg-brand-500 hover:bg-brand-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-apple">إضافة</button>
    </div>

    <svg class="absolute inset-0 pointer-events-none" width="100%" height="100%">
        @for (conn of connections(); track conn.id) {
        @let fromCard = cards().find(c => c.id === conn.fromCardId);
        @let toCard = cards().find(c => c.id === conn.toCardId);
        @if (fromCard && toCard) {
        <line (click)="deleteConnection(conn.id)" [attr.x1]="fromCard.x + 64" [attr.y1]="fromCard.y + 48"
            [attr.x2]="toCard.x + 64" [attr.y2]="toCard.y + 48" [attr.stroke]="conn.color" stroke-width="2.5"
            class="pointer-events-auto cursor-pointer hover:stroke-rose-500 transition-colors" />
        }
        }
    </svg>

    @for (card of cards(); track card.id) {
    <div class="absolute w-32 h-24 rounded-lg shadow-apple-lg p-3 cursor-move select-none transition-all hover:scale-105 hover:shadow-apple-xl"
        [style.left.px]="card.x" [style.top.px]="card.y" [style.background]="card.color"
        [class.ring-2]="selectedCardId() === card.id" [class.ring-brand-500]="selectedCardId() === card.id"
        (mousedown)="onDragStart(card.id)" (click)="onCardClick(card.id)">
        <p class="text-sm text-gray-900 font-medium line-clamp-2">{{ card.content }}</p>
        <button (click)="onDeleteCard(card.id); $event.stopPropagation();"
            class="absolute top-1 left-1 text-xs text-gray-400 hover:text-rose-600 transition-colors">✕</button>
    </div>
    }
</div>
