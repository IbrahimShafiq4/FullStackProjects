@if (_PopupService.config(); as config) {
<div class="fixed inset-0 bg-black/20 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div #panel
        class="bg-white rounded-lg p-6 w-full max-w-md shadow-apple-xl border border-surface-border animate-scale-in">
        <h2 class="text-xl font-bold text-gray-900">{{ config.title }}</h2>
        <p class="text-gray-600 text-sm mt-2 leading-relaxed">{{ config.message }}</p>
        <div class="flex gap-3 mt-6">
            <button (click)="onCancel()"
                class="flex-1 py-2.5 rounded-lg border border-surface-border text-gray-700 text-sm font-medium hover:bg-surface-muted transition-colors">
                {{ config.cancelLabel ?? 'إلغاء' }}
            </button>
            <button (click)="onConfirm()"
                class="flex-1 py-2.5 rounded-lg text-sm font-medium text-white bg-brand-500 hover:bg-brand-600 transition-colors shadow-apple">
                {{ config.confirmLabel ?? 'تأكيد' }}
            </button>
        </div>
    </div>
</div>
}
