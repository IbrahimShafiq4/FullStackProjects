<div class="min-h-screen bg-gray-50 dark:bg-gray-900 px-6 py-10 transition-colors duration-300">
    <div class="min-w-2xl mx-auto space-y-4">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">المتقدمون (مرتبون حسب التوافق)</h1>

        @for (applicant of _JobsService.applicants(); track applicant.id) {
            <div class="bg-white dark:bg-gray-800 rounded p-5 shadow border border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <div>
                    <p class="text-sm text-gray-500">تاريخ التقديم: {{ applicant.appliedAt | date:'mediumDate' }}</p>
                    <p class="text-xs text-gray-400">الحالة: {{ applicant.status }}</p>
                </div>
                <span class="px-4 py-2 rounded font-bold text-lg" [ngClass]="getScoreColorClass(applicant.matchScore)">
                    {{ applicant.matchScore }}%
                </span>
            </div>
        } @empty {
            <p class="text-gray-400 text-center py-10">لا يوجد متقدمون بعد</p>
        }
    </div>
</div>
