<div class="min-h-screen flex items-center justify-center bg-bridge-hero px-4">
    <form (ngSubmit)="onSubmit()" class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-96">
        <h1 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">إنشاء حساب</h1>
        <input [formField]="registerForm.fullName" type="text" placeholder="الاسم بالكامل"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-3">
        <input [formField]="registerForm.email" type="email" placeholder="البريد الإلكتروني"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-3">
        <input [formField]="registerForm.password" type="password" placeholder="كلمة المرور"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-3">
        <select [formField]="registerForm.role"
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg px-4 py-3 mb-4">
            <option value="Candidate">باحث عن عمل</option>
            <option value="Employer">صاحب عمل</option>
        </select>
        <button type="submit" class="w-full bg-bridge text-white py-3 rounded-lg press-feedback">تسجيل</button>
        <p class="text-center text-sm text-gray-500 mt-5">عندك حساب؟ <a routerLink="/login"
                class="text-bridge hover:underline">سجل دخولك</a></p>
    </form>
</div>
