<div class="min-h-screen grid md:grid-cols-[1fr_1.05fr] bg-paper dark:bg-dk-paper">

    <!-- Intro panel (RTL right) -->
    <aside class="hidden md:flex flex-col justify-between border-s border-line dark:border-dk-line p-10 lg:p-14">
        <a routerLink="/" class="flex items-center gap-3 self-start" aria-label="TalentBridge">
            <span
                class="tb-display text-[15px] font-semibold border border-ink dark:border-dk-ink px-2 py-[3px] rounded-sharp">TB</span>
            <span class="tb-label">TalentBridge</span>
        </a>

        <div>
            <p class="tb-label mb-6">فتح حساب</p>
            <h1 class="tb-display text-[36px] lg:text-[44px] leading-[1.02] max-w-[16ch]">
                اختر دورك،<br>
                وابدأ التحرك.
            </h1>
            <p class="mt-6 text-[14.5px] text-graphite dark:text-dk-ink-2 leading-relaxed max-w-[42ch]">
                مرشّح يبحث عن وجهة، أم فريق يفتح خطًا جديدًا؟ كل دور له مساحة خاصة به داخل الشبكة.
            </p>
        </div>

        <p class="tb-code">EST. 2026 · CAIRO / REMOTE</p>
    </aside>

    <!-- Form -->
    <section class="flex flex-col min-h-screen md:min-h-0">
        <header class="md:hidden flex items-center justify-between h-14 px-5 border-b border-line dark:border-dk-line">
            <a routerLink="/" class="flex items-center gap-2">
                <span
                    class="tb-display text-[14px] font-semibold border border-ink dark:border-dk-ink px-1.5 py-[2px] rounded-sharp">TB</span>
                <span class="tb-label">TalentBridge</span>
            </a>
            <a routerLink="/login" class="tb-label">دخول</a>
        </header>

        <div class="flex-1 flex items-center justify-center px-5 py-14 md:py-0">
            <form #regForm="ngForm" (ngSubmit)="onSubmit()" class="w-full max-w-[380px] space-y-7" novalidate>

                <header>
                    <p class="tb-label mb-3">STATION 00 · REGISTER</p>
                    <h2 class="tb-display text-[28px]">إنشاء حساب</h2>
                </header>

                <!-- Role selector -->
                <div class="space-y-3">
                    <span class="tb-label block">الدور</span>
                    <div class="grid grid-cols-2 border border-line dark:border-dk-line rounded-sharp overflow-hidden">
                        <button type="button" (click)="setRole('Candidate')" [class.bg-ink]="role() === 'Candidate'"
                            [class.text-paper]="role() === 'Candidate'" [class.dark:bg-dk-ink]="role() === 'Candidate'"
                            [class.dark:text-dk-paper]="role() === 'Candidate'" class="py-3 text-[13px] font-medium transition-colors press-feedback
                     border-e border-line dark:border-dk-line">
                            مرشّح
                        </button>
                        <button type="button" (click)="setRole('Employer')" [class.bg-ink]="role() === 'Employer'"
                            [class.text-paper]="role() === 'Employer'" [class.dark:bg-dk-ink]="role() === 'Employer'"
                            [class.dark:text-dk-paper]="role() === 'Employer'"
                            class="py-3 text-[13px] font-medium transition-colors press-feedback">
                            صاحب عمل
                        </button>
                    </div>
                </div>

                <!-- Full name -->
                <div class="space-y-2">
                    <label for="fullName" class="tb-label block">الاسم بالكامل</label>
                    <input id="fullName" name="fullName" type="text" autocomplete="name" required [ngModel]="fullName()"
                        (ngModelChange)="fullName.set($event)" class="w-full bg-transparent border-b border-line dark:border-dk-line
                   py-3 text-[15px] text-ink dark:text-dk-ink
                   focus:border-signal focus:outline-none transition-colors
                   placeholder:text-concrete/60" placeholder="مثال: أحمد علي">
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label for="email" class="tb-label block">البريد الإلكتروني</label>
                    <input id="email" name="email" type="email" autocomplete="email" required [ngModel]="email()"
                        (ngModelChange)="email.set($event)" dir="ltr" class="w-full bg-transparent border-b border-line dark:border-dk-line
                   py-3 text-[15px] text-ink dark:text-dk-ink
                   focus:border-signal focus:outline-none transition-colors
                   placeholder:text-concrete/60" placeholder="you@example.com">
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label for="password" class="tb-label block">كلمة المرور</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required
                        [ngModel]="password()" (ngModelChange)="password.set($event)" dir="ltr" class="w-full bg-transparent border-b border-line dark:border-dk-line
                   py-3 text-[15px] text-ink dark:text-dk-ink
                   focus:border-signal focus:outline-none transition-colors
                   placeholder:text-concrete/60" placeholder="6 أحرف على الأقل">
                </div>

                @if (error()) {
                <p class="text-[12.5px] text-signal border-s-2 border-signal ps-3 py-1" role="alert">
                    {{ error() }}
                </p>
                }

                <button type="submit" [disabled]="submitting()" class="w-full bg-ink dark:bg-dk-ink text-paper dark:text-dk-paper
                 py-3.5 rounded-sharp press-feedback
                 hover:bg-signal dark:hover:bg-signal transition-colors
                 disabled:opacity-50 disabled:cursor-not-allowed
                 text-[13.5px] font-medium">
                    {{ submitting() ? 'جارٍ الإنشاء…' : 'إنشاء الحساب' }}
                </button>

                <p class="text-[13px] text-concrete dark:text-dk-concrete text-center">
                    لديك حساب؟
                    <a routerLink="/login"
                        class="text-ink dark:text-dk-ink underline underline-offset-4 decoration-line hover:decoration-signal transition-colors ms-1">
                        سجّل دخولك
                    </a>
                </p>
            </form>
        </div>
    </section>
</div>
