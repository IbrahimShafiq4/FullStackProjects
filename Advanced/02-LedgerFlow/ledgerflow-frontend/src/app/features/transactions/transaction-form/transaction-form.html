<div class="min-h-screen bg-ledger-bg dark:bg-gray-900 px-6 py-10 transition-colors duration-300 ease-linear">
    <form (ngSubmit)="onSubmit()" class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded p-6 shadow border border-gray-200 dark:border-gray-700 space-y-3">
        <h1 class="font-bold text-gray-900 dark:text-white"> حركة مالية جديدة </h1>

        <select [formField]="transactionForm.categoryId" class="w-full bg-gray-50 dark:bg-gray-700 rounded border border-gray-200 dark:border-gray-700 px-4 py-2.5 text-gray-800 dark:text-gray-200">
            @for (category of _LedgerService.categories(); track category.id) {
                <option [value]="category.id"> {{ category.name }} </option>
            }
        </select>

        <input [formField]="transactionForm.amount" type="number" placeholder="المبلغ" 
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded px-4 py-2.5 text-gray-800 dark:text-gray-200"/>

        <input [formField]="transactionForm.description" type="text" placeholder="الوصف" 
            class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded px-4 py-2.5 text-gray-800 dark:text-gray-200"/>

        <button type="submit" class="w-full bg-ledger-primary text-white py-2.5 rounded font-medium"> حفظ </button>
    </form>
</div>
