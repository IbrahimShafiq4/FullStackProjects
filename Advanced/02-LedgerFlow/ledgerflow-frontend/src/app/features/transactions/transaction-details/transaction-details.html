<div dir="rtl" class="min-h-screen bg-ledger-bg dark:bg-gray-900 px-6 py-10 transition-colors duration-300 ease-linear">
    @if (transaction(); as t) {
    <div
        class="max-w-md mx-auto bg-white dark:bg-gray-800 rounded p-6 shadow border border-gray-200 dark:border-gray-700 space-y-2">
        <h1 class="font-bold text-gray-900 dark:text-white"> {{ t.description }} </h1>
        <p class="text-sm text-gray-500">الفئة: {{ t.categoryName }} </p>
        <p class="text-sm text-gray-500">التاريخ: {{ t.occuredAt | date: 'medium' }} </p>
        <p class="text-2xl font-bold" [class.text-emerald-600]="t.amount > 0" [class.text-rose-600]="t.amount < 0"> {{
            t.amount }} ج.م</p>
    </div>
    }
</div>
