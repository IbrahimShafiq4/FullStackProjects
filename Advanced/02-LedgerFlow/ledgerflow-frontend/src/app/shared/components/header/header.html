<header dir="rtl"
    class="bg-white dark:bg-gray-800 shadow border-b border-gray-200 dark:border-gray-700 px-6 py-3 flex justify-between items-center">
    <a routerLink="/" class="text-2xl font-bold bg-ledger-primary bg-clip-text text-transparent">LedgerFlow</a>
    <nav class="flex items-center gap-4 text-sm">
        @if (authService.currentUser()) {
        <a routerLink="/dashboard" class="text-gray-700 dark:text-gray-300 hover:text-ledger-primary">الرئيسية</a>
        <a routerLink="/categories" class="text-gray-700 dark:text-gray-300 hover:text-ledger-primary">الفئات</a>
        <a routerLink="/reports" class="text-gray-700 dark:text-gray-300 hover:text-ledger-primary">التقارير</a>
        <a routerLink="/profile" class="text-gray-700 dark:text-gray-300 hover:text-ledger-primary">الملف الشخصي</a>
        <span class="text-gray-600 dark:text-gray-400">|</span>
        <span class="text-gray-800 dark:text-gray-200">{{ authService.currentUser()?.fullName }}</span>
        <button (click)="logout()" class="text-rose-500 hover:underline">تسجيل خروج</button>
        } @else {
        <a routerLink="/login" class="text-gray-700 dark:text-gray-300 hover:text-ledger-primary">دخول</a>
        <a routerLink="/register" class="text-gray-700 dark:text-gray-300 hover:text-ledger-primary">تسجيل</a>
        }
        <app-dark-mode-toggle />
    </nav>
</header>
