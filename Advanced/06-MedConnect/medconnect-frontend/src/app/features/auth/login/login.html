<div class="auth">
    <div class="auth__rings" aria-hidden="true">
        <span class="auth__ring auth__ring--a"></span>
        <span class="auth__ring auth__ring--b"></span>
        <span class="auth__ring auth__ring--c"></span>
    </div>

    <div class="auth__card">
        <div class="auth__cell" aria-hidden="true">
            <span class="auth__nucleus"></span>
        </div>

        <div class="auth__head">
            <span class="eyebrow">IDENTITY · AUTH</span>
            <h1 class="auth__title">أهلاً بعودتك</h1>
            <p class="auth__sub">أدخل بياناتك للوصول إلى حسابك</p>
        </div>

        <form class="auth__form" (ngSubmit)="onSubmit()">
            <div class="auth__field">
                <label class="field-label" for="login-email">البريد الإلكتروني</label>
                <input id="login-email" type="email" class="field mono" placeholder="name@example.com" [value]="email()"
                    (input)="email.set($any($event.target).value)" autocomplete="email">
            </div>

            <div class="auth__field">
                <label class="field-label" for="login-pass">كلمة المرور</label>
                <input id="login-pass" type="password" class="field" placeholder="••••••••" [value]="password()"
                    (input)="password.set($any($event.target).value)" autocomplete="current-password">
            </div>

            <button type="submit" [disabled]="busy()" class="btn btn-primary auth__submit">
                @if (busy()) {
                <span class="pulse-dot auth__submit-dot"></span>
                جارٍ التحقق…
                } @else {
                دخول
                }
            </button>
        </form>

        <div class="auth__footer">
            <span>ليس لديك حساب؟</span>
            <a routerLink="/register-patient">مريض</a>
            <span class="auth__sep">·</span>
            <a routerLink="/register-doctor">طبيب</a>
        </div>
    </div>
</div>
