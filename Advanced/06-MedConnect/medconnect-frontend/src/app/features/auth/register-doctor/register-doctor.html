<div class="auth">
    <div class="auth__pulse auth__pulse--node" aria-hidden="true">
        <span class="auth__ring auth__ring--a"></span>
        <span class="auth__ring auth__ring--b"></span>
        <span class="auth__ring auth__ring--c"></span>
    </div>

    <div class="auth__card">
        <div class="auth__cell" aria-hidden="true">
            <span class="auth__nucleus"></span>
            <span class="auth__spike auth__spike--a"></span>
            <span class="auth__spike auth__spike--b"></span>
            <span class="auth__spike auth__spike--c"></span>
            <span class="auth__spike auth__spike--d"></span>
        </div>

        <div class="auth__head">
            <span class="eyebrow">DOCTOR · NODE</span>
            <h1 class="auth__title">انضم كطبيب</h1>
            <p class="auth__sub">أضف تخصصك وابدأ باستقبال المواعيد</p>
        </div>

        <form class="auth__form" (ngSubmit)="onSubmit()">
            <div class="auth__field">
                <label class="field-label" for="name">الاسم الكامل</label>
                <input id="name" type="text" class="field" placeholder="د. محمد أحمد" [value]="fullName()"
                    (input)="fullName.set($any($event.target).value)">
            </div>

            <div class="auth__field">
                <label class="field-label" for="specialty">التخصص</label>
                <select id="specialty" class="field" [value]="specialty()"
                    (change)="specialty.set($any($event.target).value)">
                    <option value="">اختر التخصص</option>
                    @for (s of specialties; track s) {
                    <option [value]="s">{{ s }}</option>
                    }
                </select>
            </div>

            <div class="auth__field">
                <label class="field-label" for="email">البريد الإلكتروني</label>
                <input id="email" type="email" class="field mono" placeholder="doctor@example.com" [value]="email()"
                    (input)="email.set($any($event.target).value)">
            </div>

            <div class="auth__field">
                <label class="field-label" for="password">كلمة المرور</label>
                <input id="password" type="password" class="field" placeholder="6 أحرف على الأقل" [value]="password()"
                    (input)="password.set($any($event.target).value)">
            </div>

            <button type="submit" [disabled]="busy()" class="btn btn-primary auth__submit">
                @if (busy()) { جارٍ الإنشاء… } @else { إنشاء الحساب }
            </button>
        </form>

        <div class="auth__footer">
            <span>لديك حساب بالفعل؟</span>
            <a routerLink="/login">تسجيل الدخول</a>
        </div>
    </div>
</div>
